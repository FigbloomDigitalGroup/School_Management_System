      summary: Correct a mark on a published assessment
      description: "OD-1 authorised correction of a mark on a published assessment. resource.academics.write only (class
        assessors cannot correct). Requires a reason (5-500 characters) and row_version equal to the current mark
        version (0 when the learner has no mark yet; stale = 409). The original score, the replacement, actor, time and
        reason are kept in an append-only history; the database refuses any change to a published mark without its
        matching correction row. A draft assessment is edited directly (409 here). A correction that changes nothing is
        400. Two concurrent corrections from one version: one 201, one 409. An idempotent replay returns the original
        response, even after later corrections. The audit event carries ids and versions only."
      operationId: correctMark
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.academics.write
      x-figbloom-tenantScope: path.tenantId
