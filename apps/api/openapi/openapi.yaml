      type: object
      required: [from, to, marks, counts, early_sign_outs]
      additionalProperties: false
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        marks:
          type: array
          items:
            type: object
            required: [date, session, mark]
            additionalProperties: false
            properties:
              date:
                type: string
                format: date
              session:
                type: string
                enum: [morning, afternoon]
              mark:
                type: string
                enum: [present, absent, late, excused]
        counts:
          type: object
          description: Number of marks of each kind per session, e.g. {"morning":{"present":40,"absent":2},"afternoon":{}}
          required: [morning, afternoon]
          additionalProperties: false
          properties:
            morning:
              type: object
              additionalProperties:
                type: integer
            afternoon:
              type: object
              additionalProperties:
                type: integer
        early_sign_outs:
          type: array
          items:
            type: object
            required: [id, date, signed_out_at, reason, collected_by_name, collected_by_relationship]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date
              signed_out_at:
                type: string
                format: date-time
              reason:
                type: string
              collected_by_name:
                type: string
              collected_by_relationship:
                type: string
    FamilyResults:
