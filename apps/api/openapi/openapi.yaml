        called outside any database transaction; a refusal answers 502 with the failed payment. The payment becomes
        success only when the provider confirms it (the callback or the settle job re-checks with the provider's status
        query) and is credited for the prompt's own amount. Poll GET /payments/{paymentId}. An overpayment from a prompt
        that settles after a manual payment is recorded and flagged by reconciliation, not rejected. 503 when M-Pesa is
        not configured."
