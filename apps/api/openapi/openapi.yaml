openapi: 3.1.0
info:
  title: FigBloom Replacement API
  version: 0.2.0
  description: |
    FigBloom replacement modular monolith contracts.
    Includes P1-A identity/tenancy/RBAC and VS-1 learner directory create/read.
    Authorization is server-enforced. Client-supplied role or permission lists
    are never accepted as evidence of access.
servers:
  - url: http://127.0.0.1:4100
    description: Local development
tags:
  - name: health
  - name: auth
  - name: tenancy
  - name: org
  - name: rbac
  - name: directory
paths:
  /livez:
    get:
      tags: [health]
      summary: Liveness (no database)
      description: >
        Answers while the process can serve HTTP. Never touches PostgreSQL, so a database
        outage does not make an orchestrator restart a healthy process.
      operationId: livez
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: >
        200 when the bounded database check succeeds, the session-mint HMAC self-test passes
        and the process is not draining.
        503 while shutting down (`{"status":"draining"}`), when the database check fails or
        times out (`{"status":"unavailable"}`), or when the database has no HMAC secret or one
        that does not match this process's key (`{"status":"unavailable","reason":"configuration"}`;
        login would fail closed). The check is single-flight and cached briefly,
        so probes cannot multiply database load. No internal detail or key material is returned.
      operationId: readyz
      x-figbloom-authz: public
      responses:
        "200":
          description: Ready to serve
        "503":
          description: Draining or database unavailable
          headers:
            Retry-After:
              schema: { type: integer }
  /health:
    get:
      tags: [health]
      summary: Liveness (alias of /livez)
      description: >
        Contract change (FIG-1617, OI-5): this used to run `SELECT 1` and returned a generic
        500 when PostgreSQL was down. It is now a pure liveness alias. Use `/readyz` for readiness.
      operationId: health
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /v1/health:
    get:
      tags: [health]
      summary: Versioned liveness (alias of /livez)
      description: See `/health`.
      operationId: healthV1
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /v1/auth/login/email:
    post:
      tags: [auth]
      summary: Email + password login (admin / org / super)
      operationId: loginEmail
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/login/login-id:
    post:
      tags: [auth]
      summary: School + login_id + password login
      operationId: loginLoginId
      x-figbloom-authz: public
      x-figbloom-tenantScope: requestBody.tenantId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, loginId, password]
              properties:
                tenantId: { type: string, format: uuid }
                loginId: { type: string }
                password: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      operationId: logout
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: authenticated
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/me:
    get:
      tags: [auth]
      summary: Current user, memberships and authz role
      operationId: authMe
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: authenticated
      responses:
        "200":
          description: >-
            Identity snapshot. `authz` is null when the session's school is no
            longer usable (membership archived, school suspended); the caller can
            then still list memberships and call select-tenant. Memberships are
            returned in full (ordered by created_at, id) up to a hard safety
            bound of 2000; overflow yields HTTP 409 and never silent truncation.
            `membershipsComplete` is true when the full authorised set is present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/select-tenant:
    post:
      tags: [auth]
      summary: Set active tenant on the session (membership required)
      operationId: selectTenant
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: requestBody.tenantId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Active tenant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelectTenantResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/password/change:
    post:
      tags: [auth]
      summary: Change password (authenticated; required when must_change_password)
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: none
      description: >
        Allowed even when must_change_password is true. Verifies the current
        password, enforces policy, clears the flag, revokes other sessions, and
        keeps the current session. Passwords are never written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordChangeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tenants/{tenantId}:
    get:
      tags: [tenancy]
      summary: Read tenant (same-tenant only)
      operationId: getTenant
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [tenant.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Tenant record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantRecord" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rbac/permissions:
    get:
      tags: [rbac]
      summary: Effective permissions for the active tenant context
      operationId: getPermissions
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [rbac.permissions.read]
      x-figbloom-tenantScope: session
      description: >
        Effective permission codes are SQL keyset-paginated as `items` ordered by
        `code` (FIG-1621). Clients that need the full set must follow `next_cursor`.
        This is a UX hint only; every endpoint re-checks permission server-side.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Permission set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionSet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/resources/learners:
    get:
      tags: [tenancy]
      summary: Representative learner resource predicate (P1-A)
      operationId: checkLearnerResource
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.learner.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Access granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResourceAccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/learners:
    post:
      tags: [directory]
      summary: Create a learner in the school directory (VS-1)
      description: >
        Creates a learner record for the path tenant. Requires resource.learner.write
        (school_admin, or staff/teacher with area.people, or an equivalent org-admin
        delegation). Tenant id in the path must match the session / X-Tenant-Id context.
        Class assignment, guardians, health and import are out of scope for VS-1.
      operationId: createLearner
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.learner.write]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLearnerRequest" }
      responses:
        "201":
          description: Learner created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/learners/{learnerId}:
    get:
      tags: [directory]
      summary: Retrieve a learner by id (VS-1)
      description: >
        Returns a learner owned by the path tenant. Requires resource.learner.read.
        Cross-tenant ids return 404 (not found) when the row is not in the caller's tenant.
      operationId: getLearner
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.learner.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Learner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/guardians:
    post:
      tags: [directory]
      summary: Create a guardian linked to existing learners (VS-2)
      description: >
        Creates a guardian directory record and its initial learner links in one
        transaction. At least one learner is required; every learner must be an active
        learner of the path tenant. Requires resource.guardian.write and
        resource.learner.read. A guardian is a person record only: no login account is
        created and no user is bound (provisioning is deferred). Archived learners cannot
        receive new guardian relationships and get the same 404 as unknown learners.
        Duplicate learner ids in one request (including case-only differences) return 400.
        The response returns the guardian id and links only, not the contact fields.
      operationId: createGuardian
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.guardian.write, resource.learner.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuardianRequest" }
      responses:
        "201":
          description: Guardian created with links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedGuardianResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/guardians/{guardianId}:
    get:
      tags: [directory]
      summary: Retrieve a guardian contact record (VS-2)
      description: >
        Requires resource.guardian.read. Returns contact fields only — linked learner
        identifiers are not included. Use GET .../learners/{learnerId}/guardians to see
        relationships for a known learner. A guardian id that is not in the path tenant
        returns 404.
      operationId: getGuardian
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.guardian.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian contact record (no linked learner ids)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianContactResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/guardians/{guardianId}/links:
    post:
      tags: [directory]
      summary: Link an existing guardian to another learner (VS-2)
      description: >
        Requires resource.guardian.write and resource.learner.read. The guardian and the
        learner must both belong to the path tenant; the learner must be active
        (404 for unknown, foreign or archived: the same response for all three). A duplicate guardian-learner link
        returns 409.
      operationId: addGuardianLink
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.guardian.write, resource.learner.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianLinkRequest" }
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianLinkResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/learners/{learnerId}/guardians:
    get:
      tags: [directory]
      summary: List the guardians of a learner (VS-2)
      description: >
        Requires resource.guardian.read and resource.learner.read. A learner id that is
        not in the path tenant returns 404.
      operationId: listLearnerGuardians
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [resource.guardian.read, resource.learner.read]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
      responses:
        "200":
          description: >
            Guardians linked to the learner. SQL keyset on
            `(link.created_at, link.id)` ascending; timestamps in cursors keep
            PostgreSQL microsecond precision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerGuardiansResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/org/schools:
    get:
      tags: [org]
      summary: Aggregate member-school summaries for the caller's organizations (R2-05)
      description: >
        Organization-level aggregate visibility only. Does not grant school-admin
        or learner record access. Requires org.tenants.read. SQL keyset-paginated
        (FIG-1621): `{ items, page: { limit, next_cursor } }`. Order is
        `organization.name, tenant.name, tenant.id` with `COLLATE "C"` on both
        the ORDER BY and the cursor predicate (locale-independent). The cursor is opaque and
        identifies the last school by id (names are unbounded, so they are never embedded); a
        cursor whose school is no longer in the caller's set is `400 validation_error`.
      operationId: listOrgSchools
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [org.tenants.read]
      x-figbloom-tenantScope: none
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
      responses:
        "200":
          description: Member school summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSchoolList" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rbac/org-delegations:
    get:
      tags: [rbac]
      summary: List org-admin school delegations for the active school
      description: >
        SQL keyset-paginated (FIG-1621) on `created_at DESC, id ASC` with a
        mixed-direction predicate. Query `status` defaults to `active`
        (only non-revoked rows) — behavioural change from the pre-pagination
        endpoint that returned revoked history too. Pass `revoked` or `all` to widen.
      operationId: listOrgDelegations
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [rbac.org_delegations.read]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
        - name: status
          in: query
          required: false
          description: Filter by revocation state. Default `active` (breaking vs pre-FIG-1621).
          schema: { type: string, enum: [active, revoked, all], default: active }
      responses:
        "200":
          description: Delegation rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationList" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [rbac]
      summary: Grant school-scoped permissions to an org_admin (R2-05)
      operationId: grantOrgDelegations
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [rbac.org_delegations.manage]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegateUserId, permissionCodes]
              properties:
                delegateUserId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationGrantResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
    delete:
      tags: [rbac]
      summary: Revoke school-scoped org_admin delegations (R2-05)
      operationId: revokeOrgDelegations
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [rbac.org_delegations.manage]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delegateUserId]
              properties:
                delegateUserId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationRevokeResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rbac/staff-areas:
    put:
      tags: [rbac]
      summary: Replace staff admin areas (audited)
      operationId: setStaffAreas
      security: [{ bearerAuth: [] }]
      x-figbloom-authz: permission
      x-figbloom-permissions: [rbac.staff_areas.manage]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, areas]
              properties:
                userId: { type: string, format: uuid }
                areas:
                  type: array
                  items: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Areas updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAreasResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional (FIG-1623). 8-128 characters from `A-Z a-z 0-9 . _ : -`. Within 24 hours,
        for the same school, caller and key: the same request again returns the ORIGINAL status
        with the resource re-read by reference (so it reflects the resource's current state;
        header `Idempotent-Replayed: true`) and causes no second effect or audit event; a different
        request with the same key is `422 idempotency_key_reused`. Concurrent duplicates produce
        one effect. A caller who is not (or no longer) authorised is refused as usual: a key never
        grants access. Guarantee: at most one committed effect per (school, caller, key) in the window;
        not exactly-once across client, network or process failures. Header-less requests are unchanged.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: >-
        Optional request-scoped school. Never an authority: it is honoured only
        when the caller holds a school membership, active organisation-admin
        reach or platform super-admin, re-checked on every request. Must be a
        UUID (400 otherwise). Absent: the session's active school applies.
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      description: >
        Page size (FIG-1621). Default 50, maximum 200. Decimal integers only;
        values above 200, `0x10`, `1e2` and non-integers are `400 validation_error`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque SQL keyset cursor v2 from a previous `page.next_cursor`. Keys are
        PostgreSQL text (timestamps preserve microseconds). Bound to sort, filter
        and tenant/org scope fingerprint. Wrong version, wrong key types, reuse
        across tenants/filters/sorts, truncation or tampering → `400 validation_error`.
        Cursors carry no privilege.
      schema: { type: string, minLength: 8, maxLength: 2048 }
    PageSortUnsupported:
      name: sort
      in: query
      required: false
      description: >
        Not supported on this endpoint. Only the documented fixed sort is used.
        Any other value is `400 validation_error` (never silently ignored).
      schema: { type: string }
  responses:
    ValidationError:
      description: Malformed or oversized request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized (default deny)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource or membership does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict (for example duplicate admission number)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >-
        Auth token bucket exhausted (capacity 5, +2 tokens per 5 s, cost 1 per
        attempt, per IP first then per account). Retry-After is omitted when the
        request cost exceeds capacity (waiting cannot help for that cost).
      headers:
        Retry-After:
          description: Whole seconds until the request would be admitted (omitted when cost > capacity)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    PublicUser:
      type: object
      required: [id, full_name, email, must_change_password, platform_role]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: [string, "null"] }
        must_change_password: { type: boolean }
        platform_role: { type: [string, "null"] }
    LoginResponse:
      type: object
      required: [token, expiresAt, user, activeTenantId]
      properties:
        token:
          type: string
          description: Opaque bearer token, returned once; only its SHA-256 is stored.
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/PublicUser" }
        activeTenantId: { type: [string, "null"], format: uuid }
    SelectTenantResponse:
      type: object
      required: [activeTenantId, activeOrganizationId]
      properties:
        activeTenantId: { type: [string, "null"], format: uuid }
        activeOrganizationId: { type: [string, "null"], format: uuid }
    PasswordChangeResponse:
      type: object
      required: [ok, user]
      properties:
        ok: { type: boolean }
        user: { $ref: "#/components/schemas/PublicUser" }
    Me:
      type: object
      required: [user, session, memberships, membershipsComplete, authz]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            activeTenantId: { type: [string, "null"], format: uuid }
            expiresAt: { type: string, format: date-time }
        memberships:
          type: array
          maxItems: 2000
          items:
            type: object
            properties:
              tenantId: { type: string, format: uuid }
              role: { type: string }
              loginId: { type: [string, "null"] }
              tenantStatus: { type: string }
        membershipsComplete:
          type: boolean
          description: True when the response includes every authorised membership (no silent truncation).
        authz:
          type: [object, "null"]
          properties:
            role: { type: string }
            tenantId: { type: [string, "null"], format: uuid }
            isSuperAdmin: { type: boolean }
    TenantRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        timezone: { type: string }
        organizationId: { type: string, format: uuid }
    PageInfo:
      type: object
      required: [limit, next_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        next_cursor: { type: [string, "null"] }
    PermissionSet:
      type: object
      required:
        [
          role,
          tenantId,
          mayAdminister,
          isOrgAdminForTenant,
          isSuperAdmin,
          delegatedPermissions,
          actingVia,
          items,
          page,
        ]
      description: >-
        The single source a client may use to decide which actions and
        navigation to SHOW. It is a UX hint only; every endpoint re-checks the
        same permission server-side. R2-05: org admins do not automatically
        mayAdminister; school powers appear only via delegatedPermissions.
        Effective permission codes are keyset-paginated as `items` (FIG-1621).
      properties:
        role: { type: string }
        tenantId: { type: string, format: uuid }
        mayAdminister: { type: boolean }
        isOrgAdminForTenant: { type: boolean }
        isSuperAdmin: { type: boolean }
        delegatedPermissions: { type: array, items: { type: string } }
        actingVia: { type: string }
        items: { type: array, items: { type: string } }
        page: { $ref: "#/components/schemas/PageInfo" }
    OrgSchoolList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, slug, status, organizationId]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              status: { type: string }
              organizationId: { type: string, format: uuid }
              organizationName: { type: string }
              organizationSlug: { type: string }
        page: { $ref: "#/components/schemas/PageInfo" }
    OrgDelegationList:
      type: object
      required: [tenantId, items, page]
      properties:
        tenantId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              delegateUserId: { type: string, format: uuid }
              permissionCode: { type: string }
              grantedBy: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
              revokedAt: { type: [string, "null"], format: date-time }
        page: { $ref: "#/components/schemas/PageInfo" }
    OrgDelegationGrantResult:
      type: object
      properties:
        ok: { type: boolean }
        tenantId: { type: string, format: uuid }
        delegateUserId: { type: string, format: uuid }
        granted: { type: array, items: { type: string } }
    OrgDelegationRevokeResult:
      type: object
      properties:
        ok: { type: boolean }
        tenantId: { type: string, format: uuid }
        delegateUserId: { type: string, format: uuid }
        revoked: { type: array, items: { type: string } }
    StaffAreasResult:
      type: object
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        areas: { type: array, items: { type: string } }
    LearnerResourceAccess:
      type: object
      required: [tenantId, resource, access]
      properties:
        tenantId: { type: string, format: uuid }
        resource: { type: string, enum: [learners] }
        access: { type: string, enum: [granted] }
        note: { type: string }
    CreateLearnerRequest:
      type: object
      required: [admission_no, full_name, gender]
      properties:
        admission_no:
          type: string
          minLength: 1
          maxLength: 32
          description: School admission number (unique per tenant; People terminology)
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        gender:
          type: string
          enum: [male, female]
        boarding:
          type: boolean
          default: false
        date_of_birth:
          type: [string, "null"]
          format: date
          description: Optional YYYY-MM-DD
    Learner:
      type: object
      required:
        [
          id,
          tenantId,
          admission_no,
          full_name,
          gender,
          boarding,
          date_of_birth,
          active,
          archived_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        admission_no: { type: string }
        full_name: { type: string }
        gender: { type: string, enum: [male, female] }
        boarding: { type: boolean }
        date_of_birth: { type: [string, "null"], format: date }
        active: { type: boolean }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LearnerResponse:
      type: object
      required: [learner]
      properties:
        learner: { $ref: "#/components/schemas/Learner" }
    GuardianLinkRequest:
      type: object
      required: [learner_id, relationship]
      additionalProperties: false
      properties:
        learner_id: { type: string, format: uuid }
        relationship: { type: string, enum: [mother, father, guardian] }
        is_primary_payer:
          type: boolean
          default: false
          description: Stored only; single-payer enforcement is deferred.
    CreateGuardianRequest:
      type: object
      description: >
        Values are validated as sent, without trimming. Send names and numbers already
        trimmed: no leading or trailing whitespace. Lengths (minLength / maxLength) are
        counted in Unicode code points, as JSON Schema defines them, so a supplementary
        character such as an emoji counts as one. Accepted content is stored unchanged:
        no normalization is applied.
      required: [full_name, learners]
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^\S([\s\S]*\S)?$'
        phone:
          type: [string, "null"]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        alt_phone:
          type: [string, "null"]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        email:
          type: [string, "null"]
          maxLength: 254
          # The pattern is the authoritative rule and is exactly what the backend enforces.
          # format: email alone is advisory (many validators ignore it) and is looser, so it
          # is kept only as a hint for tooling.
          format: email
          pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
        learners:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/GuardianLinkRequest" }
    GuardianLink:
      type: object
      required: [id, guardianId, learnerId, relationship, is_primary_payer, created_at]
      properties:
        id: { type: string, format: uuid }
        guardianId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        relationship: { type: string, enum: [mother, father, guardian] }
        is_primary_payer: { type: boolean }
        created_at: { type: string, format: date-time }
    GuardianContact:
      type: object
      required: [id, tenantId, full_name, phone, alt_phone, email, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        alt_phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatedGuardian:
      description: >
        Returned by create. Contact fields are not echoed back (F-2, F-6): a caller who
        can create a guardian but cannot read guardian contacts gets no contact details.
      type: object
      required: [id, tenantId, links]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        links:
          type: array
          items: { $ref: "#/components/schemas/GuardianLink" }
    CreatedGuardianResponse:
      type: object
      required: [guardian]
      properties:
        guardian: { $ref: "#/components/schemas/CreatedGuardian" }
    GuardianContactResponse:
      type: object
      required: [guardian]
      properties:
        guardian: { $ref: "#/components/schemas/GuardianContact" }
    GuardianLinkResponse:
      type: object
      required: [link]
      properties:
        link: { $ref: "#/components/schemas/GuardianLink" }
    LearnerGuardian:
      type: object
      required:
        [id, tenantId, full_name, phone, alt_phone, email, linkId, relationship, is_primary_payer, created_at]
      properties:
        id: { type: string, format: uuid, description: Guardian id }
        tenantId: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        alt_phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        linkId: { type: string, format: uuid }
        relationship: { type: string, enum: [mother, father, guardian] }
        is_primary_payer: { type: boolean }
        created_at: { type: string, format: date-time, description: When the link was made }
    LearnerGuardiansResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LearnerGuardian" }
        page: { $ref: "#/components/schemas/PageInfo" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, validation_error, rate_limited, conflict, idempotency_key_reused, service_unavailable, internal_error]
            message:
              type: string
            request_id:
              type: string
              description: >
                Correlation id of the request (additive, OI-4). Also returned in the X-Request-Id
                response header. An inbound X-Request-Id is honoured only if it matches
                [A-Za-z0-9._-]{8,64}; otherwise one is generated.
            details:
              type: array
              description: >
                Additive field-level validation details (OI-4 / FIG-1621). Present on some
                `validation_error` responses. Never echoes submitted values, secrets, SQL or stacks.
              items:
                type: object
                required: [field, code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
