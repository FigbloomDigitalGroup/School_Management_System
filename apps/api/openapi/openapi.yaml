        Document METADATA only. No file bytes exist anywhere: `storage_status` is always `metadata_only` and
        `object_available` is always `false`. There is no upload or download operation, by design — object storage is an
        approved but unbuilt platform dependency (parity register P3-DOC-02; see PHASE3-DOCUMENT-STORAGE-CONTRACT.md).
        The storage key is generated by the database and is never returned.
      type: object
      required:
        - id
        - tenantId
        - subject_type
        - subject_id
        - doc_type
        - file_name
        - content_type
        - byte_size
        - storage_status
        - object_available
        - uploaded_by
        - archived_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        subject_type:
          type: string
          enum:
            - learner
            - guardian
            - staff
        subject_id:
          type: string
          format: uuid
        doc_type:
          type: string
          minLength: 1
          maxLength: 64
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type:
            - string
            - "null"
          maxLength: 128
        byte_size:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 104857600
        storage_status:
          type: string
          enum:
            - metadata_only
        object_available:
          type: boolean
          enum:
            - false
        uploaded_by:
          type:
            - string
            - "null"
          format: uuid
        archived_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
