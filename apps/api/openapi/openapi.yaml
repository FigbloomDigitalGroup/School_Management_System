              - txn_date
              - reference
              - description
              - amount_minor
              - direction
              - balance_minor
            additionalProperties: false
      required:
        - bank_name
        - account_number
      additionalProperties: false
    FinanceBankLineMatchRequest:
      type: object
      properties:
        payment_id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
            - type: "null"
        invoice_id:
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
            - type: "null"
        note:
          anyOf:
            - type: string
              maxLength: 300
            - type: "null"
      additionalProperties: false
    FinanceBankLineIgnoreRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 3
          maxLength: 300
      required:
        - note
      additionalProperties: false
    GenericObject:
      type: object
