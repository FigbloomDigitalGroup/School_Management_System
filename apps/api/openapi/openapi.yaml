  /v1/tenants/{tenantId}/documents:
    get:
      tags:
        - directory
      summary: List directory document metadata (Phase 3)
      description: >
        Metadata only: no object exists behind any row (`storage_status` is `metadata_only`, `object_available` is
        `false`). A document describes its subject, so reading one needs the subject's own read permission IN ADDITION
        to `resource.document.read`: `resource.learner.read`, `resource.guardian.read` or `resource.staff.read`
        (P3-AUDIT-010). Subject types the caller may not read are omitted from unfiltered listings; asking for one
        explicitly via `subject_type=` is refused with 403. `area.people` implies the learner and staff permissions but
        NEVER the guardian one (FIG-1614).
      operationId: listDocuments
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.document.read
      x-figbloom-conditionalPermissions:
        - resource.learner.read
        - resource.guardian.read
        - resource.staff.read
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: subject_type
          in: query
          schema:
            type: string
            enum:
              - learner
              - guardian
              - staff
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Document metadata page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - directory
      summary: Register document metadata (Phase 3)
      description: >
        Registers document METADATA only. This does not upload, store, scan or retain any bytes and never creates an
        object. The client does not choose a storage key: any `storage_key` property is rejected with 400, and the
        server generates an opaque, non-guessable key internally that is never returned. A guardian subject additionally
        needs the subject's own permission, checked BEFORE the subject is looked up so the response never confirms that
        a subject id exists: `resource.learner.read` for a learner, `resource.guardian.write` for a guardian,
        `resource.staff.read` for a staff member (P3-AUDIT-010). The subject must exist in the same tenant. File names
        may not contain path separators or control characters.
      operationId: registerDocument
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.document.write
      x-figbloom-conditionalPermissions:
        - resource.learner.read
        - resource.guardian.write
        - resource.staff.read
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDocumentRequest"
      responses:
        "201":
          description: Document metadata registered (no object exists; storage_status is metadata_only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
