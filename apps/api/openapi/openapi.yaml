      tags: [ rbac ]
      summary: List org-admin school delegations for the active school
      description: >
        SQL keyset-paginated (FIG-1621) on `created_at DESC, id ASC` with a
        mixed-direction predicate. Query `status` defaults to `active` (only
        non-revoked rows) — behavioural change from the pre-pagination endpoint
        that returned revoked history too. Pass `revoked` or `all` to widen.
