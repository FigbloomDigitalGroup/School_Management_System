  /v1/tenants/{tenantId}/trips/{tripId}/driver-location:
    post:
      tags:
        - transport
      summary: The driver of an active trip reports a GPS fix (ordered, plausibility-checked, idempotent)
      operationId: transportDriverLocation
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.transport.drive
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                speed_kmh:
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 250
                    - type: "null"
                heading:
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 360
                    - type: "null"
                recorded_at:
                  anyOf:
                    - type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    - type: "null"
              required:
                - lat
                - lng
              additionalProperties: false
      responses:
        "201":
          description: Fix recorded (200 with replayed=true for an exact resend)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
