  /v1/tenants/{tenantId}/cbe-assessments/{cbeAssessmentId}/results:
    post:
      tags:
        - academics
      summary: Record a CBE result
      description: "OD-3: one current result per (assessment, learner, strand, outcome). First write: 201 created. The same
        values again: 200 unchanged (safe retry, nothing audited as a change). Different values: send row_version
        (current version) and a reason (5-500 characters): 200 revised, the previous value is kept in the revision
        history; without them 409/400. The strand or outcome must belong to the assessment's learning area (an outcome
        also under the named strand) and the learner must be a member of its class (400). An idempotent replay returns
        the original response, even after later revisions."
      operationId: recordCbeResult
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.academics.write
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cbeAssessmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCbeAssessmentsResultsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - result
                  - outcome
                properties:
                  result:
                    $ref: "#/components/schemas/CbeResult"
                  outcome:
                    type: string
                    enum:
                      - revised
                      - unchanged
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - result
                  - outcome
                properties:
                  result:
                    $ref: "#/components/schemas/CbeResult"
                  outcome:
                    type: string
                    enum:
                      - created
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
