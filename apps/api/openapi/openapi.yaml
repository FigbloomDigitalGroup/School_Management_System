    RegisterDocumentRequest:
      description: >
        There is deliberately no `storage_key` property: the database generates the only key that will ever exist for
        the row, and sending one is a 400 (P3-AUDIT-005 / F-04).
      type: object
      required:
        - subject_type
        - subject_id
        - doc_type
        - file_name
      additionalProperties: false
      properties:
        subject_type:
          type: string
          enum:
            - learner
            - guardian
            - staff
        subject_id:
          type: string
          format: uuid
        doc_type:
          type: string
          minLength: 1
          maxLength: 64
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Display metadata destined for a Content-Disposition header: no path separators, no control characters, not
            "." or "..".
        content_type:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        byte_size:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 104857600
    SchoolProfile:
      description: >
        School identity (from `tenants`) plus directory-owned profile fields (from `school_profiles`). The profile row
        is a 1:1 extension of the school and is created on demand by the first PATCH, so there is no create operation
        and no way to produce a second profile for one school. `logo_object_key` is neither accepted nor returned until
        the storage integration assigns one (P3-AUDIT-005).
      type: object
      required:
        - tenantId
        - name
        - slug
        - status
        - timezone
        - organizationId
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
        status:
          type: string
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        organizationId:
          type: string
          format: uuid
        county:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        country:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        level:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
        institution_type:
          type:
            - string
            - "null"
          enum:
            - k12
            - higher_ed
            - null
        contact_email:
          type:
            - string
            - "null"
          maxLength: 254
        contact_phone:
          type:
            - string
            - "null"
          minLength: 5
          maxLength: 32
        moe_registration:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
        accent:
          type:
            - string
            - "null"
          maxLength: 32
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    SchoolProfileResponse:
      type: object
      required:
        - schoolProfile
      properties:
        schoolProfile:
          $ref: "#/components/schemas/SchoolProfile"
    PatchSchoolProfileRequest:
      description: >
        Partial update; at least one field is required. `name` and `timezone` are school identity and require a full
        school administrator (or platform super admin) — an org admin holding a delegated
        `resource.school_profile.write` is refused (403) when either is present (P3-AUDIT-002). `timezone` must be a
        zone name PostgreSQL knows (P3-AUDIT-004).
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        county:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        country:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
        level:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
        institution_type:
          type:
            - string
            - "null"
          enum:
            - k12
            - higher_ed
            - null
        contact_email:
          type:
            - string
            - "null"
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        contact_phone:
          type:
            - string
            - "null"
          minLength: 5
          maxLength: 32
          pattern: ^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$
        moe_registration:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
        accent:
          type:
            - string
            - "null"
          maxLength: 32
          pattern: ^(#[A-Za-z0-9_-]{1,31}|[A-Za-z0-9_-]{1,32})$
          description: >
            A short presentation token that clients interpolate into CSS, so it is restricted to letters, digits, `-`,
            `_` and an optional leading `#` (P3-AUDIT-013).
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - reauth_required
                - mfa_required
                - not_found
                - validation_error
                - rate_limited
                - conflict
                - idempotency_key_reused
                - service_unavailable
                - internal_error
            message:
              type: string
            request_id:
              type: string
              description: >
                Correlation id of the request (additive, OI-4). Also returned in the X-Request-Id response header. An
                inbound X-Request-Id is honoured only if it matches [A-Za-z0-9._-]{8,64}; otherwise one is generated.
            details:
              type: array
              description: >
                Additive field-level validation details (OI-4 / FIG-1621). Present on some `validation_error` responses.
                Never echoes submitted values, secrets, SQL or stacks.
              items:
                type: object
                required:
                  - field
                  - code
                  - message
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
