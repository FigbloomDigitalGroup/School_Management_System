openapi: 3.1.0
info:
  title: FigBloom Replacement API
  version: 0.2.0
  description: |
    FigBloom replacement modular monolith contracts.
    Includes P1-A identity/tenancy/RBAC and Phase 3 School Directory (learners, guardians,
    staff, school profile, document metadata). VS-1/VS-2 contracts are preserved.
    Authorization is server-enforced. Client-supplied role or permission lists
    are never accepted as evidence of access.
servers:
  - url: http://127.0.0.1:4100
    description: Local development
tags:
  - name: health
  - name: auth
  - name: tenancy
  - name: org
  - name: rbac
  - name: directory
paths:
  /livez:
    get:
      tags: [ health ]
      summary: Liveness (no database)
      description: >
        Answers while the process can serve HTTP. Never touches PostgreSQL, so a
        database outage does not make an orchestrator restart a healthy process.
      operationId: livez
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /readyz:
    get:
      tags: [ health ]
      summary: Readiness
      description: >
        200 when the bounded database check succeeds, the session-mint HMAC
        self-test passes and the process is not draining. 503 while shutting
        down (`{"status":"draining"}`), when the database check fails or times
        out (`{"status":"unavailable"}`), or when the database has no HMAC
        secret or one that does not match this process's key
        (`{"status":"unavailable","reason":"configuration"}`; login would fail
        closed). The check is single-flight and cached briefly, so probes cannot
        multiply database load. No internal detail or key material is returned.
      operationId: readyz
      x-figbloom-authz: public
      responses:
        "200":
          description: Ready to serve
        "503":
          description: Draining or database unavailable
          headers:
            Retry-After:
              schema: { type: integer }
  /health:
    get:
      tags: [ health ]
      summary: Liveness (alias of /livez)
      description: >
        Contract change (FIG-1617, OI-5): this used to run `SELECT 1` and
        returned a generic 500 when PostgreSQL was down. It is now a pure
        liveness alias. Use `/readyz` for readiness.
      operationId: health
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /v1/health:
    get:
      tags: [ health ]
      summary: Versioned liveness (alias of /livez)
      description: See `/health`.
      operationId: healthV1
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
  /v1/auth/login/email:
    post:
      tags: [ auth ]
      summary: Email + password login (admin / org / super)
      operationId: loginEmail
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/login/login-id:
    post:
      tags: [ auth ]
      summary: School + login_id + password login
      operationId: loginLoginId
      x-figbloom-authz: public
      x-figbloom-tenantScope: requestBody.tenantId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ tenantId, loginId, password ]
              properties:
                tenantId: { type: string, format: uuid }
                loginId: { type: string }
                password: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/logout:
    post:
      tags: [ auth ]
      summary: Revoke current session
      operationId: logout
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: authenticated
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/me:
    get:
      tags: [ auth ]
      summary: Current user, memberships and authz role
      operationId: authMe
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: authenticated
      responses:
        "200":
          description: >-
            Identity snapshot. `authz` is null when the session's school is no
            longer usable (membership archived, school suspended); the caller
            can then still list memberships and call select-tenant. Memberships
            are returned in full (ordered by created_at, id) up to a hard safety
            bound of 2000; overflow yields HTTP 409 and never silent truncation.
            `membershipsComplete` is true when the full authorised set is
            present.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/select-tenant:
    post:
      tags: [ auth ]
      summary: Set active tenant on the session (membership required)
      operationId: selectTenant
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: requestBody.tenantId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ tenantId ]
              properties:
                tenantId: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Active tenant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelectTenantResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/password/change:
    post:
      tags: [ auth ]
      summary: Change password (authenticated; required when must_change_password)
      operationId: changePassword
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: none
      description: >
        Allowed even when must_change_password is true. Verifies the current
        password, enforces policy, clears the flag, revokes other sessions, and
        keeps the current session. Passwords are never written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ currentPassword, newPassword ]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordChangeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tenants/{tenantId}:
    get:
      tags: [ tenancy ]
      summary: Read tenant (same-tenant only)
      operationId: getTenant
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ tenant.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Tenant record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantRecord" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rbac/permissions:
    get:
      tags: [ rbac ]
      summary: Effective permissions for the active tenant context
      operationId: getPermissions
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.permissions.read ]
      x-figbloom-tenantScope: session
      description: >
        Effective permission codes are SQL keyset-paginated as `items` ordered
        by `code` (FIG-1621). Clients that need the full set must follow
        `next_cursor`. This is a UX hint only; every endpoint re-checks
        permission server-side.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Permission set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionSet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/resources/learners:
    get:
      tags: [ tenancy ]
      summary: Representative learner resource predicate (P1-A)
      operationId: checkLearnerResource
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Access granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResourceAccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/learners:
    get:
      tags: [ directory ]
      summary: List learners (Phase 3)
      operationId: listLearners
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [ name, created ], default: name }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Keyset page of learners
          content:
            application/json:
              schema:
                type: object
                required: [ learners, page ]
                properties:
                  learners:
                    type: array
                    items: { $ref: "#/components/schemas/Learner" }
                  page: { $ref: "#/components/schemas/PageInfo" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ directory ]
      summary: Create a learner in the school directory (VS-1)
      description: >
        Creates a learner record for the path tenant. Requires
        resource.learner.write (school_admin, or staff/teacher with area.people,
        or an equivalent org-admin delegation). Tenant id in the path must match
        the session / X-Tenant-Id context. Class assignment, guardians, health
        and import are out of scope for VS-1.
      operationId: createLearner
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLearnerRequest" }
      responses:
        "201":
          description: Learner created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/learners/{learnerId}:
    get:
      tags: [ directory ]
      summary: Retrieve a learner by id (VS-1)
      description: >
        Returns a learner owned by the path tenant. Requires
        resource.learner.read. Cross-tenant ids return 404 (not found) when the
        row is not in the caller's tenant.
      operationId: getLearner
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Learner record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ directory ]
      summary: Update a learner profile (Phase 3)
      description: >
        Partial update of the fields sent. Concurrent PATCHes on one learner are serialised by a
        row lock, so the later write cannot silently discard the earlier one's fields
        (P3-AUDIT-012).
      operationId: updateLearner
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchLearnerRequest" }
      responses:
        "200":
          description: Updated learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/learners/{learnerId}/archive:
    post:
      tags: [ directory ]
      summary: Archive a learner (Phase 3)
      operationId: archiveLearner
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archived learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/learners/{learnerId}/restore:
    post:
      tags: [ directory ]
      summary: Restore an archived learner (Phase 3)
      operationId: restoreLearner
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.learner.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Restored learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/school-profile:
    get:
      tags: [ directory ]
      summary: Get school directory profile (Phase 3)
      operationId: getSchoolProfile
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.school_profile.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: School profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolProfileResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ directory ]
      summary: Update school directory profile (Phase 3)
      description: >
        School name and timezone are school identity: only a full school administrator (or a
        platform super admin) may change them. `area.people` implies read only (F-02). An org admin
        holding an explicit `resource.school_profile.write` delegation may change the OTHER profile
        fields (county, country, level, institution_type, contact_email, contact_phone,
        moe_registration, accent) but is refused (403) when `name` or `timezone` is present
        (P3-AUDIT-002). `timezone` must be a time zone name known to PostgreSQL (for example
        `Africa/Nairobi`); anything else is a 400. `logo_object_key` is not accepted or returned: a
        server-assigned logo key arrives with the storage integration (P3-AUDIT-005).
      operationId: patchSchoolProfile
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.school_profile.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSchoolProfileRequest" }
      responses:
        "200":
          description: Updated school profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolProfileResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/staff:
    get:
      tags: [ directory ]
      summary: List staff directory (Phase 3)
      operationId: listStaff
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.staff.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Staff page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ directory ]
      summary: Create staff directory member (Phase 3)
      operationId: createStaff
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.staff.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStaffRequest" }
      responses:
        "201":
          description: Staff created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
  /v1/tenants/{tenantId}/staff/{staffId}:
    get:
      tags: [ directory ]
      summary: Get staff member (Phase 3)
      operationId: getStaff
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.staff.read ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [ directory ]
      summary: Update staff member (Phase 3)
      operationId: updateStaff
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ resource.staff.write ]
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: staffId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchStaffRequest" }
      responses:
        "200":
