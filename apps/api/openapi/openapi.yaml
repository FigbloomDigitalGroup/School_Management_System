    put:
      tags:
        - rbac
      summary: Replace staff admin areas (audited)
      description: >
        A school administrator or platform super administrator may set any area. An organization administrator acting
        through a delegation may assign, and remove, only the `area.*` codes delegated to them (403, audited
        `rbac.staff_areas.denied` with reason `area_beyond_authority`, otherwise); areas the person already holds
        outside that authority are kept. Only the difference is applied: an area the person already holds keeps who
