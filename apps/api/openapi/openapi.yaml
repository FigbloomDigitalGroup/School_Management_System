  /v1/tenants/{tenantId}/storage/objects:
    post:
      operationId: initStorageUpload
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - resource.document.write
      security:
        - bearerAuth: []
      tags:
        - Storage
      summary: Initiate an authorized object upload and obtain a presigned upload URL
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - *a9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_resource_type:
                  type: string
                  enum:
                    - directory_document
                    - export_artifact
                    - medication_authorization
                    - general
                owner_resource_id:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    - type: "null"
                original_filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                content_type:
                  type: string
                  minLength: 3
                  maxLength: 128
                byte_size:
                  type: integer
                  minimum: 1
                  maximum: 26214400
                checksum_sha256:
                  anyOf:
                    - type: string
                      pattern: ^[0-9a-f]{64}$
                    - type: "null"
              required:
                - owner_resource_type
                - original_filename
                - content_type
                - byte_size
              additionalProperties: false
      responses:
        "201":
          description: Upload initiated
          content:
            application/json:
              schema:
                type: object
                required:
                  - object
                  - upload
                properties:
                  object:
                    type: object
                    additionalProperties: true
                  upload:
                    description: When status is ready, the client must PUT the exact declared byte_size with every header in requiredHeaders
                      (content-type and content-length are part of the signature); a mismatching upload is rejected by
                      storage or discarded on completion.
                    oneOf:
                      - type: object
                        required:
                          - status
                          - url
                          - expiresInSeconds
                        properties:
                          status:
                            type: string
                            enum:
                              - ready
                          url:
                            type: string
                          expiresInSeconds:
                            type: integer
                          requiredHeaders:
                            type: object
                            additionalProperties:
                              type: string
                      - type: object
                        required:
                          - status
                          - reason
                        properties:
                          status:
                            type: string
                            enum:
                              - not_configured
                          reason:
                            type: string
                            enum:
                              - storage_provider_not_configured
        "400": *a5
        "401": *a6
        "403": *a7
        "404": *a8
