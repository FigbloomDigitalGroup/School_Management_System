        it) and/or file METADATA (name, type, size). No object storage exists: no file byte is stored or served, and no
        storage key is ever returned. Allowed file types: JPEG, PNG, WebP, PDF up to 10 MB. The office
        (`resource.finance.administer`) may submit on a family's behalf (submitted_via office). A family member needs
        a live account link to the invoice's learner (docs/FAMILY-READS.md); anyone else answers 403. A transaction code is accepted once per school while its
        proof is live (a rejected proof frees it) and never when it is already recorded as a payment (409). Confirm a
        proof only by recording its payment with proof_id."
