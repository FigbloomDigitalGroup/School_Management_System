  /v1/org/schools:
    get:
      tags:
        - org
      summary: Aggregate member-school summaries for the caller's organizations (R2-05)
      description: >
        Organization-level aggregate visibility only. Does not grant school-admin or learner record access. Requires
        org.tenants.read. SQL keyset-paginated (FIG-1621): `{ items, page: { limit, next_cursor } }`. Order is
        `organization.name, tenant.name, tenant.id` with `COLLATE "C"` on both the ORDER BY and the cursor predicate
        (locale-independent). The cursor is opaque and identifies the last school by id (names are unbounded, so they
        are never embedded); a cursor whose school is no longer in the caller's set is `400 validation_error`.
      operationId: listOrgSchools
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - org.tenants.read
      x-figbloom-tenantScope: none
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
      responses:
        "200":
          description: Member school summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSchoolList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/rbac/org-delegations:
    get:
      tags:
        - rbac
      summary: List org-admin school delegations for the active school
      description: >
        SQL keyset-paginated (FIG-1621) on `created_at DESC, id ASC` with a mixed-direction predicate. Query `status`
        defaults to `active` (only non-revoked rows) — behavioural change from the pre-pagination endpoint that returned
        revoked history too. Pass `revoked` or `all` to widen.
      operationId: listOrgDelegations
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - rbac.org_delegations.read
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageSortUnsupported"
        - name: status
          in: query
          required: false
          description: Filter by revocation state. Default `active` (breaking vs pre-FIG-1621).
          schema:
            type: string
            enum:
              - active
              - revoked
              - all
            default: active
      responses:
        "200":
          description: Delegation rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDelegationList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - rbac
      summary: Grant school-scoped permissions to an org_admin (R2-05, FIG-1609)
      description: >
        Delegable codes are exactly `tenant.read`, `rbac.staff_areas.manage`, `rbac.school_roles.manage`,
        `resource.learner.read` and the `area.*` codes except `area.people` (owner decision, 2026-11-17: it carries
        learner, staff and document writes); every other code, including `area.people` and `resource.guardian.*`, is
        refused with 400. See ORG-ADMIN-POLICY.md. Callable by a school administrator of the school
        (`rbac.org_delegations.manage`), a platform super administrator, or an organization administrator of the
        organization that owns the school (`org.delegations.grant`, non-delegable). The grantor need not hold the
        permission being delegated. Only allowlisted codes, only to another org_admin of the same organization, never to
        oneself. Refused with 403 on a suspended school for every actor, including a super administrator; refusals are
        audited as `rbac.org_delegation.denied` with a reason class.
      operationId: grantOrgDelegations
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - rbac.org_delegations.manage
        - org.delegations.grant
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delegateUserId
                - permissionCodes
              properties:
                delegateUserId:
                  type: string
                  format: uuid
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDelegationGrantResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotent replay of a grant that is no longer true (delegation revoked, or the recipient is no longer an
            active org admin), or an original request that did not complete. Use a new Idempotency-Key to grant again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
    delete:
      tags:
        - rbac
      summary: Revoke school-scoped org_admin delegations (R2-05, FIG-1609)
      description: >
        Callable by a school administrator of the school, a platform super administrator, or an organization
        administrator of the owning organization (`org.delegations.revoke`, non-delegable), who may revoke any
        delegation in the organization, including one a school administrator granted. Allowed on a suspended school
        (revocation only removes privilege). Takes effect on the next request. The audit event records the acting
        administrator, every original grantor, the recipient, organization, school, permission codes and outcome.
      operationId: revokeOrgDelegations
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - rbac.org_delegations.manage
        - org.delegations.revoke
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delegateUserId
              properties:
                delegateUserId:
                  type: string
                  format: uuid
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDelegationRevokeResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
