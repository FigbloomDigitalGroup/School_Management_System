          type: integer
          description: Money in minor units (cents; 100 = KES 1). Never a float.
        adjustments_minor:
          type: integer
          description: Signed sum of recorded total adjustments.
        total_minor:
          type: integer
          description: Money in minor units (cents; 100 = KES 1). Never a float.
        paid_minor:
          type: integer
          description: Money in minor units (cents; 100 = KES 1). Never a float.
