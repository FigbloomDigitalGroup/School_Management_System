            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceMpesaReconcileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
