        "200":
          description: Delegation rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationList" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ rbac ]
      summary: Grant school-scoped permissions to an org_admin (R2-05, FIG-1609)
      description: >
        Delegable codes are exactly `tenant.read`, `rbac.staff_areas.manage`, `rbac.school_roles.manage`,
        `resource.learner.read` and the `area.*` codes except `area.people` (owner decision, 2026-11-17:
        it carries learner, staff and document writes); every other code, including
        `area.people` and `resource.guardian.*`, is refused with 400. See ORG-ADMIN-POLICY.md.
        Callable by a school administrator of the school (`rbac.org_delegations.manage`), a platform
        super administrator, or an organization administrator of the organization that owns the
        school (`org.delegations.grant`, non-delegable). The grantor need not hold the permission
        being delegated. Only allowlisted codes, only to another org_admin of the same
        organization, never to oneself. Refused with 403 on a suspended school for every actor,
        including a super administrator; refusals are audited as `rbac.org_delegation.denied`
        with a reason class.
      operationId: grantOrgDelegations
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.org_delegations.manage, org.delegations.grant ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ delegateUserId, permissionCodes ]
              properties:
                delegateUserId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationGrantResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotent replay of a grant that is no longer true (delegation revoked, or the
            recipient is no longer an active org admin), or an original request that did not complete.
            Use a new Idempotency-Key to grant again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
    delete:
      tags: [ rbac ]
      summary: Revoke school-scoped org_admin delegations (R2-05, FIG-1609)
      description: >
        Callable by a school administrator of the school, a platform super administrator, or an
        organization administrator of the owning organization (`org.delegations.revoke`,
        non-delegable), who may revoke any delegation in the organization, including one a school
        administrator granted. Allowed on a suspended school (revocation only removes privilege).
        Takes effect on the next request. The audit event records the acting administrator, every
        original grantor, the recipient, organization, school, permission codes and outcome.
      operationId: revokeOrgDelegations
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.org_delegations.manage, org.delegations.revoke ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ delegateUserId ]
              properties:
                delegateUserId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgDelegationRevokeResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rbac/guardian-access:
    get:
      tags: [ rbac ]
      summary: List one person's active explicit guardian access grants (FIG-1614)
      operationId: listGuardianAccess
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.guardian_access.manage ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: userId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active grants (at most two rows)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianAccessList" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ rbac ]
      summary: Grant explicit guardian read and/or write access to one staff member (FIG-1614, Option D)
      description: >
        School administrator (or platform super administrator) only; not delegable to org admins.
        `resource.guardian.read` and `resource.guardian.write` are independent. Grantee must be an
        active user with a live teacher or staff membership in this school (400 otherwise).
        Granting an already-active code is a no-op. `area.people` never implies either code.
        Refused (403) on a suspended school for every administrator, a super administrator included.
        Audited as `rbac.guardian_access.granted` / `.denied`.
      operationId: grantGuardianAccess
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.guardian_access.manage ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ userId, permissionCodes ]
              properties:
                userId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, enum: [ resource.guardian.read, resource.guardian.write ] }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianAccessResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [ rbac ]
      summary: Revoke explicit guardian access from one staff member (FIG-1614)
      description: >
        Revokes the named codes, or every active code when `permissionCodes` is omitted. Effective
        on the next request. 404 when nothing was active. Audited with the original grantor.
      operationId: revokeGuardianAccess
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.guardian_access.manage ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ userId ]
              properties:
                userId: { type: string, format: uuid }
                permissionCodes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items: { type: string, enum: [ resource.guardian.read, resource.guardian.write ] }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianAccessResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/rbac/staff-areas:
    put:
      tags: [ rbac ]
      summary: Replace staff admin areas (audited)
      description: >
        A school administrator or platform super administrator may set any area. An organization
        administrator acting through a delegation may assign, and remove, only the `area.*` codes
        delegated to them (403, audited `rbac.staff_areas.denied` with reason `area_beyond_authority`,
        otherwise); areas the person already holds outside that authority are kept. Only the difference is
        applied: an area the person already holds keeps who assigned it and when, so an assignment made
        under a delegation stays attributable after the delegation ends (it is not revoked with it). Targets are teacher
        or staff members of the active school only; you cannot change your own areas.
      operationId: setStaffAreas
      security: [ { bearerAuth: [] } ]
      x-figbloom-authz: permission
      x-figbloom-permissions: [ rbac.staff_areas.manage ]
      x-figbloom-tenantScope: session
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ userId, areas ]
              properties:
                userId: { type: string, format: uuid }
                areas:
                  type: array
                  items: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Areas updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAreasResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional (FIG-1623). 8-128 characters from `A-Z a-z 0-9 . _ : -`. Within
        24 hours, for the same school, caller and key: the same request again
        returns the ORIGINAL status with the resource re-read by reference (so
        it reflects the resource's current state; header `Idempotent-Replayed:
        true`) and causes no second effect or audit event; a different request
        with the same key is `422 idempotency_key_reused`. Concurrent duplicates
        produce one effect. A caller who is not (or no longer) authorised is
        refused as usual: a key never grants access. Guarantee: at most one
        committed effect per (school, caller, key) in the window; not
        exactly-once across client, network or process failures. Header-less
        requests are unchanged.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: >-
        Optional request-scoped school. Never an authority: it is honoured only
        when the caller holds a school membership, active organisation-admin
        reach or platform super-admin, re-checked on every request. Must be a
        UUID (400 otherwise). Absent: the session's active school applies.
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      description: >
        Page size (FIG-1621). Default 50, maximum 200. Decimal integers only;
        values above 200, `0x10`, `1e2` and non-integers are `400
        validation_error`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque SQL keyset cursor v2 from a previous `page.next_cursor`. Keys are
        PostgreSQL text (timestamps preserve microseconds). Bound to sort,
        filter and tenant/org scope fingerprint. Wrong version, wrong key types,
        reuse across tenants/filters/sorts, truncation or tampering → `400
        validation_error`. Cursors carry no privilege.
      schema: { type: string, minLength: 8, maxLength: 2048 }
    SearchQuery:
      name: q
      in: query
      required: false
      description: >
        Case-insensitive "contains" search over the listed name fields (learners also match the
        admission number). The value is matched LITERALLY: `%`, `_` and `\` are escaped, so `q=%`
        is a search for a per-cent sign and not a way to return every row (P3-AUDIT-013). Bounded
        at 120 characters — the longest searchable value — and control characters are refused
        (400). Blank or whitespace-only behaves as if `q` were absent. Personal names are never
        normalised: accents, apostrophes and non-Latin scripts are compared as typed.
      schema: { type: string, minLength: 1, maxLength: 120 }
    PageSortUnsupported:
      name: sort
      in: query
      required: false
      description: >
        Not supported on this endpoint. Only the documented fixed sort is used.
        Any other value is `400 validation_error` (never silently ignored).
      schema: { type: string }
  responses:
    ValidationError:
      description: Malformed or oversized request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Authenticated but not authorized (default deny). Also returned, for every authenticated
        route except POST /v1/auth/password/change, POST /v1/auth/logout and GET /v1/auth/me,
        while the user's `must_change_password` flag is set ("Password change required", FIG-1604).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource or membership does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict (for example duplicate admission number)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >-
        Auth token bucket exhausted (capacity 5, +2 tokens per 5 s, cost 1 per
        attempt, per IP first then per account). Retry-After is omitted when the
        request cost exceeds capacity (waiting cannot help for that cost).
      headers:
        Retry-After:
          description: Whole seconds until the request would be admitted (omitted when
            cost > capacity)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Ok:
      type: object
      required: [ ok ]
      properties:
        ok: { type: boolean }
    PublicUser:
      type: object
      required: [ id, full_name, email, must_change_password, platform_role ]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: [ string, "null" ] }
        must_change_password: { type: boolean }
        platform_role: { type: [ string, "null" ] }
    LoginResponse:
      type: object
      required: [ token, expiresAt, user, activeTenantId ]
      properties:
        token:
          type: string
          description: Opaque bearer token, returned once; only its SHA-256 is stored.
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/PublicUser" }
        activeTenantId: { type: [ string, "null" ], format: uuid }
    SelectTenantResponse:
      type: object
      required: [ activeTenantId, activeOrganizationId ]
      properties:
        activeTenantId: { type: [ string, "null" ], format: uuid }
        activeOrganizationId: { type: [ string, "null" ], format: uuid }
    PasswordChangeResponse:
      type: object
      required: [ ok, user ]
      properties:
        ok: { type: boolean }
        user: { $ref: "#/components/schemas/PublicUser" }
    Me:
      type: object
      required: [ user, session, memberships, membershipsComplete, authz ]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            activeTenantId: { type: [ string, "null" ], format: uuid }
            expiresAt: { type: string, format: date-time }
        memberships:
          type: array
          maxItems: 2000
          items:
            type: object
            properties:
              tenantId: { type: string, format: uuid }
              role: { type: string }
              loginId: { type: [ string, "null" ] }
              tenantStatus: { type: string }
        membershipsComplete:
          type: boolean
          description: True when the response includes every authorised membership (no
            silent truncation).
        authz:
          type: [ object, "null" ]
          properties:
            role: { type: string }
            tenantId: { type: [ string, "null" ], format: uuid }
            isSuperAdmin: { type: boolean }
    TenantRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        timezone: { type: string }
        organizationId: { type: string, format: uuid }
    PageInfo:
      type: object
      required: [ limit, next_cursor ]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        next_cursor: { type: [ string, "null" ] }
    PermissionSet:
      type: object
      required:
        [
          role,
          tenantId,
          mayAdminister,
          isOrgAdminForTenant,
          isSuperAdmin,
          delegatedPermissions,
          actingVia,
          items,
          page
        ]
      description: >-
        The single source a client may use to decide which actions and
        navigation to SHOW. It is a UX hint only; every endpoint re-checks the
        same permission server-side. R2-05: org admins do not automatically
        mayAdminister; school powers appear only via delegatedPermissions.
        Effective permission codes are keyset-paginated as `items` (FIG-1621).
      properties:
        role: { type: string }
        tenantId: { type: string, format: uuid }
        mayAdminister: { type: boolean }
        isOrgAdminForTenant: { type: boolean }
        isSuperAdmin: { type: boolean }
        delegatedPermissions: { type: array, items: { type: string } }
        actingVia: { type: string }
        items: { type: array, items: { type: string } }
        page: { $ref: "#/components/schemas/PageInfo" }
    OrgSchoolList:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items:
            type: object
            required: [ id, name, slug, status, organizationId ]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              status: { type: string }
              organizationId: { type: string, format: uuid }
              organizationName: { type: string }
              organizationSlug: { type: string }
        page: { $ref: "#/components/schemas/PageInfo" }
    OrgDelegationList:
      type: object
      required: [ tenantId, items, page ]
      properties:
        tenantId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              delegateUserId: { type: string, format: uuid }
              permissionCode: { type: string }
              grantedBy: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
              revokedAt: { type: [ string, "null" ], format: date-time }
        page: { $ref: "#/components/schemas/PageInfo" }
    GuardianAccessResult:
      type: object
      properties:
        ok: { type: boolean }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        granted: { type: array, items: { type: string } }
        revoked: { type: array, items: { type: string } }
    GuardianAccessList:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              permissionCode: { type: string }
              grantedBy: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
    OrgDelegationGrantResult:
      type: object
      properties:
        ok: { type: boolean }
        tenantId: { type: string, format: uuid }
        delegateUserId: { type: string, format: uuid }
        granted: { type: array, items: { type: string } }
    OrgDelegationRevokeResult:
      type: object
      properties:
        ok: { type: boolean }
        tenantId: { type: string, format: uuid }
        delegateUserId: { type: string, format: uuid }
        revoked: { type: array, items: { type: string } }
    StaffAreasResult:
      type: object
      properties:
        ok: { type: boolean }
        userId: { type: string, format: uuid }
        areas: { type: array, items: { type: string } }
    LearnerResourceAccess:
      type: object
      required: [ tenantId, resource, access ]
      properties:
        tenantId: { type: string, format: uuid }
        resource: { type: string, enum: [ learners ] }
        access: { type: string, enum: [ granted ] }
        note: { type: string }
    CreateLearnerRequest:
      type: object
      required: [ admission_no, full_name, gender ]
      properties:
        admission_no:
          type: string
          minLength: 1
          maxLength: 32
          description: School admission number (unique per tenant; People terminology)
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        gender:
          type: string
          enum: [ male, female ]
        boarding:
          type: boolean
          default: false
        date_of_birth:
          type: [ string, "null" ]
          format: date
          description: Optional YYYY-MM-DD
    Learner:
      type: object
      required:
        [
          id,
          tenantId,
          admission_no,
          full_name,
          gender,
          boarding,
          date_of_birth,
          active,
          archived_at,
          created_at,
          updated_at
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        admission_no: { type: string }
        full_name: { type: string }
        gender: { type: string, enum: [ male, female ] }
        boarding: { type: boolean }
        date_of_birth: { type: [ string, "null" ], format: date }
        active: { type: boolean }
        archived_at: { type: [ string, "null" ], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LearnerResponse:
      type: object
      required: [ learner ]
      properties:
        learner: { $ref: "#/components/schemas/Learner" }
    GuardianLinkRequest:
      type: object
      required: [ learner_id, relationship ]
      additionalProperties: false
      properties:
        learner_id: { type: string, format: uuid }
        relationship: { type: string, enum: [ mother, father, guardian ] }
        is_primary_payer:
          type: boolean
          default: false
          description: Stored only; single-payer enforcement is deferred.
    CreateGuardianRequest:
      type: object
      description: >
        Values are validated as sent, without trimming. Send names and numbers
        already trimmed: no leading or trailing whitespace. Lengths (minLength /
        maxLength) are counted in Unicode code points, as JSON Schema defines
        them, so a supplementary character such as an emoji counts as one.
        Accepted content is stored unchanged: no normalization is applied.
      required: [ full_name, learners ]
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^\S([\s\S]*\S)?$'
        phone:
          type: [ string, "null" ]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        alt_phone:
          type: [ string, "null" ]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        email:
          type: [ string, "null" ]
          maxLength: 254
          # The pattern is the authoritative rule and is exactly what the backend enforces.
          # format: email alone is advisory (many validators ignore it) and is looser, so it
          # is kept only as a hint for tooling.
          format: email
          pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
        learners:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/GuardianLinkRequest" }
    GuardianLink:
      type: object
      required: [ id, guardianId, learnerId, relationship, is_primary_payer, created_at ]
      properties:
        id: { type: string, format: uuid }
        guardianId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        relationship: { type: string, enum: [ mother, father, guardian ] }
        is_primary_payer: { type: boolean }
        created_at: { type: string, format: date-time }
    GuardianContact:
      type: object
      required:
        [
          id,
          tenantId,
          full_name,
          phone,
          alt_phone,
          email,
          active,
          archived_at,
          created_at,
          updated_at
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: [ string, "null" ] }
        alt_phone: { type: [ string, "null" ] }
        email: { type: [ string, "null" ] }
        active: { type: boolean }
        archived_at: { type: [ string, "null" ], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GuardianWriteAck:
      description: >
        What a caller holding `resource.guardian.write` but NOT `resource.guardian.read` receives
        from PATCH, archive and restore: identifiers only, never contact details (P3-AUDIT-001).

        `additionalProperties: false` is load-bearing, not decoration: without it a full
        `GuardianContact` body also satisfies this schema, both branches of the `oneOf` below
        match, and a strict validator rejects every read-capable response (audit finding A-02).
      type: object
      required: [ id, tenantId ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
    GuardianMutationResponse:
      type: object
      required: [ guardian ]
      properties:
        guardian:
          oneOf:
            - $ref: "#/components/schemas/GuardianContact"
            - $ref: "#/components/schemas/GuardianWriteAck"
    GuardianList:
      type: object
      required: [ guardians, page ]
      properties:
        guardians:
          type: array
          items: { $ref: "#/components/schemas/GuardianContact" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CreatedGuardian:
      description: >
        Returned by create. Contact fields are not echoed back (F-2, F-6): a
        caller who can create a guardian but cannot read guardian contacts gets
        no contact details.
      type: object
      required: [ id, tenantId, links ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        links:
          type: array
          items: { $ref: "#/components/schemas/GuardianLink" }
    CreatedGuardianResponse:
      type: object
      required: [ guardian ]
      properties:
        guardian: { $ref: "#/components/schemas/CreatedGuardian" }
    GuardianContactResponse:
      type: object
      required: [ guardian ]
      properties:
        guardian: { $ref: "#/components/schemas/GuardianContact" }
    GuardianLinkResponse:
      type: object
      required: [ link ]
      properties:
        link: { $ref: "#/components/schemas/GuardianLink" }
    LearnerGuardian:
      type: object
      required:
        [
          id,
          tenantId,
          full_name,
          phone,
          alt_phone,
          email,
          linkId,
          relationship,
          is_primary_payer,
          created_at
        ]
      properties:
        id: { type: string, format: uuid, description: Guardian id }
        tenantId: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: [ string, "null" ] }
        alt_phone: { type: [ string, "null" ] }
        email: { type: [ string, "null" ] }
        linkId: { type: string, format: uuid }
        relationship: { type: string, enum: [ mother, father, guardian ] }
        is_primary_payer: { type: boolean }
        created_at: { type: string, format: date-time, description: When the link was made }
    LearnerGuardiansResponse:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LearnerGuardian" }
        page: { $ref: "#/components/schemas/PageInfo" }
    PatchLearnerRequest:
      description: >
        Partial update. At least one field is required. Unknown fields are rejected (400), unlike
        the create body. Omitted fields keep their current value; `date_of_birth: null` clears it.
        An archived learner is not updatable — restore it first (400).
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        admission_no: { type: string, minLength: 1, maxLength: 32 }
        full_name: { type: string, minLength: 1, maxLength: 120 }
        gender: { type: string, enum: [ male, female ] }
        boarding: { type: boolean }
        date_of_birth: { type: [ string, "null" ], format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
    StaffMember:
      description: >
        A staff directory record. Directory identity only: it grants no RBAC power and carries no
        credentials. `userId` optionally links the record to an account that is an active member
        of this school; invitation and login provisioning belong to Identity and are deferred
        (parity register P3-ST-04). `classification` is a directory label, not an authorization.
      type: object
      required:
        [
          id,
          tenantId,
          full_name,
          staff_title,
          classification,
          phone,
          email,
          userId,
          active,
          archived_at,
          created_at,
          updated_at
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        full_name: { type: string }
        staff_title: { type: [ string, "null" ] }
        classification: { type: string, enum: [ school_admin, teacher, driver, staff ] }
        phone: { type: [ string, "null" ] }
        email: { type: [ string, "null" ] }
        userId: { type: [ string, "null" ], format: uuid }
        active: { type: boolean }
        archived_at: { type: [ string, "null" ], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StaffResponse:
      type: object
      required: [ staff ]
      properties:
        staff: { $ref: "#/components/schemas/StaffMember" }
    StaffList:
      type: object
      required: [ staff, page ]
      properties:
        staff:
          type: array
          items: { $ref: "#/components/schemas/StaffMember" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CreateStaffRequest:
      type: object
      required: [ full_name ]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        staff_title: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        classification:
          type: string
          enum: [ school_admin, teacher, driver, staff ]
          default: staff
        phone:
          type: [ string, "null" ]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        email:
          type: [ string, "null" ]
          maxLength: 254
          format: email
          pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
        userId:
          type: [ string, "null" ]
          format: uuid
          description: >
            Must be an active member of this school (enforced in the database, migration 022);
            anything else is a 400 that does not reveal whether the account exists. At most one
            active staff record per account per school (409).
    PatchStaffRequest:
      description: Partial update; at least one field is required. Unknown fields are rejected.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        staff_title: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        classification: { type: string, enum: [ school_admin, teacher, driver, staff ] }
        phone:
          type: [ string, "null" ]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        email:
          type: [ string, "null" ]
          maxLength: 254
          format: email
          pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
        userId: { type: [ string, "null" ], format: uuid }
    DirectoryDocument:
      description: >
        Document METADATA only. No file bytes exist anywhere: `storage_status` is always
        `metadata_only` and `object_available` is always `false`. There is no upload or download
        operation, by design — object storage is an approved but unbuilt platform dependency
        (parity register P3-DOC-02; see PHASE3-DOCUMENT-STORAGE-CONTRACT.md). The storage key is
        generated by the database and is never returned.
      type: object
      required:
        [
          id,
          tenantId,
          subject_type,
          subject_id,
          doc_type,
          file_name,
          content_type,
          byte_size,
          storage_status,
          object_available,
          uploaded_by,
          archived_at,
          created_at,
          updated_at
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        subject_type: { type: string, enum: [ learner, guardian, staff ] }
        subject_id: { type: string, format: uuid }
        doc_type: { type: string, minLength: 1, maxLength: 64 }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: [ string, "null" ], maxLength: 128 }
        byte_size: { type: [ integer, "null" ], minimum: 0, maximum: 104857600 }
        storage_status: { type: string, enum: [ metadata_only ] }
        object_available: { type: boolean, enum: [ false ] }
        uploaded_by: { type: [ string, "null" ], format: uuid }
        archived_at: { type: [ string, "null" ], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentResponse:
      type: object
      required: [ document ]
      properties:
        document: { $ref: "#/components/schemas/DirectoryDocument" }
    DocumentList:
      type: object
      required: [ documents, page ]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/DirectoryDocument" }
        page: { $ref: "#/components/schemas/PageInfo" }
    RegisterDocumentRequest:
      description: >
        There is deliberately no `storage_key` property: the database generates the only key that
        will ever exist for the row, and sending one is a 400 (P3-AUDIT-005 / F-04).
      type: object
      required: [ subject_type, subject_id, doc_type, file_name ]
      additionalProperties: false
      properties:
        subject_type: { type: string, enum: [ learner, guardian, staff ] }
        subject_id: { type: string, format: uuid }
        doc_type: { type: string, minLength: 1, maxLength: 64 }
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Display metadata destined for a Content-Disposition header: no path separators, no
            control characters, not "." or "..".
        content_type: { type: [ string, "null" ], minLength: 1, maxLength: 128 }
        byte_size: { type: [ integer, "null" ], minimum: 0, maximum: 104857600 }
    SchoolProfile:
      description: >
        School identity (from `tenants`) plus directory-owned profile fields (from
        `school_profiles`). The profile row is a 1:1 extension of the school and is created on
        demand by the first PATCH, so there is no create operation and no way to produce a second
        profile for one school. `logo_object_key` is neither accepted nor returned until the
        storage integration assigns one (P3-AUDIT-005).
      type: object
      required: [ tenantId, name, slug, status, timezone, organizationId ]
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string }
        status: { type: string }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        organizationId: { type: string, format: uuid }
        county: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        country: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        level: { type: [ string, "null" ], minLength: 1, maxLength: 64 }
        institution_type: { type: [ string, "null" ], enum: [ k12, higher_ed, null ] }
        contact_email: { type: [ string, "null" ], maxLength: 254 }
        contact_phone: { type: [ string, "null" ], minLength: 5, maxLength: 32 }
        moe_registration: { type: [ string, "null" ], minLength: 1, maxLength: 64 }
        accent: { type: [ string, "null" ], maxLength: 32 }
        updated_at: { type: [ string, "null" ], format: date-time }
    SchoolProfileResponse:
      type: object
      required: [ schoolProfile ]
      properties:
        schoolProfile: { $ref: "#/components/schemas/SchoolProfile" }
    PatchSchoolProfileRequest:
      description: >
        Partial update; at least one field is required. `name` and `timezone` are school identity
        and require a full school administrator (or platform super admin) — an org admin holding a
        delegated `resource.school_profile.write` is refused (403) when either is present
        (P3-AUDIT-002). `timezone` must be a zone name PostgreSQL knows (P3-AUDIT-004).
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        county: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        country: { type: [ string, "null" ], minLength: 1, maxLength: 120 }
        level: { type: [ string, "null" ], minLength: 1, maxLength: 64 }
        institution_type: { type: [ string, "null" ], enum: [ k12, higher_ed, null ] }
        contact_email:
          type: [ string, "null" ]
          maxLength: 254
          format: email
          pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-.]*)[A-Za-z0-9_+\-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
        contact_phone:
          type: [ string, "null" ]
          minLength: 5
          maxLength: 32
          pattern: '^[0-9+()\-][0-9+()\-\s]{3,30}[0-9+()\-]$'
        moe_registration: { type: [ string, "null" ], minLength: 1, maxLength: 64 }
        accent:
          type: [ string, "null" ]
          maxLength: 32
          pattern: '^(#[A-Za-z0-9_-]{1,31}|[A-Za-z0-9_-]{1,32})$'
          description: >
            A short presentation token that clients interpolate into CSS, so it is restricted to
            letters, digits, `-`, `_` and an optional leading `#` (P3-AUDIT-013).
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message ]
          properties:
            code:
              type: string
              enum:
                [
                  unauthorized,
                  forbidden,
                  not_found,
                  validation_error,
                  rate_limited,
                  conflict,
                  idempotency_key_reused,
                  service_unavailable,
                  internal_error
                ]
            message:
              type: string
            request_id:
              type: string
              description: >
                Correlation id of the request (additive, OI-4). Also returned in
                the X-Request-Id response header. An inbound X-Request-Id is
                honoured only if it matches [A-Za-z0-9._-]{8,64}; otherwise one
                is generated.
            details:
              type: array
              description: >
                Additive field-level validation details (OI-4 / FIG-1621).
                Present on some `validation_error` responses. Never echoes
                submitted values, secrets, SQL or stacks.
              items:
                type: object
                required: [ field, code, message ]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
