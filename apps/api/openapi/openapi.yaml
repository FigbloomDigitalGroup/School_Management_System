  /v1/mpesa/callback:
    post:
      tags:
        - finance
      summary: M-Pesa STK callback (provider)
      description: "Public endpoint for Safaricom. Authenticated by the shared secret in the callback URL (`?token=`,
        constant-time compare): a missing or wrong token is 403 and nothing is read or stored. Rate-limited per caller
        address on every attempt (including wrong tokens). The CheckoutRequestID alone resolves the school, invoice and
        learner; the body is never trusted for money amounts. The outcome is re-confirmed with the provider's status
        query; success also requires a valid unique receipt (normally from this callback) before the prompt is credited.
        The amount credited is the prompt's own (a different callback amount is logged and flagged by reconciliation,
        never credited). Settlement is idempotent: a duplicate or replayed callback changes nothing. An unknown
        CheckoutRequestID is quarantined for platform operations (no tenant, no money) and answered 200 so the provider
        stops retrying. When the provider cannot confirm yet, or success lacks a unique receipt, the answer is 503 so
        Safaricom redelivers; a background job also retries until a receipt arrives or the job is exhausted."
      operationId: mpesaCallback
      x-figbloom-authz: public
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallback"
      responses:
        "200":
          description: Accepted (settled, already settled, or quarantined)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MpesaCallbackAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The provider could not confirm the result yet; redeliver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
