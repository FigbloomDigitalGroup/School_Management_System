        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ directory ]
      summary: Register document metadata (Phase 3)
      description: >
        Registers document METADATA only. This does not upload, store, scan or retain any bytes and
        never creates an object. The client does not choose a storage key: any `storage_key`
        property is rejected with 400, and the server generates an opaque, non-guessable key
        internally that is never returned. A guardian subject additionally needs
        the subject's own permission, checked BEFORE the subject is looked up so the response never
        confirms that a subject id exists: `resource.learner.read` for a learner,
