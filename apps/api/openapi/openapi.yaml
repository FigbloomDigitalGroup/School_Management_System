openapi: 3.1.0
info:
  title: FigBloom Replacement API
  version: 0.2.0
  description: |
    FigBloom replacement modular monolith contracts.
    Includes P1-A identity/tenancy/RBAC, Phase 3 School Directory (learners, guardians,
    staff, school profile, document metadata), Stage 9 academics, Stage 10 attendance, Stage 11 finance
    (fees, invoices, payments, M-Pesa, payment proofs, reconciliation, AI helper billing foundations),
    Stage 12 communications announcements/visits/prefs/chat/sick-bay (in-app/push; SMS/email/LiveKit/FCM deferred),
    Stage 13 inventory/leave/activities/transport (GPS/LLM deferred), Stage 14 reporting aggregates,
    and Stage 16 learner CSV import preview/apply foundations.
    VS-1/VS-2 contracts are preserved.
    Authorization is server-enforced. Client-supplied role or permission lists
    are never accepted as evidence of access.
servers:
  - url: http://127.0.0.1:4100
    description: Local development
tags:
  - name: platform
  - name: accounts
  - name: health
  - name: auth
  - name: tenancy
  - name: org
  - name: rbac
  - name: directory
  - name: academics
  - name: attendance
  - name: finance
  - name: communications
  - name: health_services
  - name: chat
  - name: inventory
  - name: leave
  - name: activities
  - name: transport
  - name: reporting
  - name: import
  - name: me
  - name: family
paths:
  /livez:
    get:
      tags:
        - health
      summary: Liveness (no database)
      description: >
        Answers while the process can serve HTTP. Never touches PostgreSQL, so a database outage does not make an
        orchestrator restart a healthy process.
      operationId: livez
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /readyz:
    get:
      tags:
        - health
      summary: Readiness
      description: >
        200 when the bounded database check succeeds, the session-mint HMAC self-test passes and the process is not
        draining. 503 while shutting down (`{"status":"draining"}`), when the database check fails or times out
        (`{"status":"unavailable"}`), or when the database has no HMAC secret or one that does not match this process's
        key (`{"status":"unavailable","reason":"configuration"}`; login would fail closed). The check is single-flight
        and cached briefly, so probes cannot multiply database load. No internal detail or key material is returned.
      operationId: readyz
      x-figbloom-authz: public
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReady"
        "503":
          description: Draining or database unavailable
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessUnavailable"
  /health:
    get:
      tags:
        - health
      summary: Liveness (alias of /livez)
      description: >
        Contract change (FIG-1617, OI-5): this used to run `SELECT 1` and returned a generic 500 when PostgreSQL was
        down. It is now a pure liveness alias. Use `/readyz` for readiness.
      operationId: health
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /v1/health:
    get:
      tags:
        - health
      summary: Versioned liveness (alias of /livez)
      description: See `/health`.
      operationId: healthV1
      x-figbloom-authz: public
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /v1/platform/schools:
    post:
      tags:
        - platform
      summary: Provision a school
      description: Super administrator only. Creates the school (and a single-school organisation unless organization_id is
        given) and issues the initial school-administrator invitation. No default credentials exist; the administrator
        sets their own password by accepting the invitation.
      operationId: platformProvisionSchool
      security:
        - bearerAuth: []
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: none
      x-figbloom-note: super administrator (enforced in the database)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - school_name
                - slug
                - admin_email
              properties:
                organization_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                organization_name:
                  type: string
                  minLength: 2
                  maxLength: 160
                school_name:
                  type: string
                  minLength: 2
                  maxLength: 160
                slug:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{2,35}$
                admin_email:
                  type: string
                  minLength: 3
                  maxLength: 254
                admin_name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - school
                  - invitation
                properties:
                  school:
                    type: object
                    additionalProperties: false
                    required:
                      - tenant_id
                      - organization_id
                    properties:
                      tenant_id:
                        type: string
                        format: uuid
                      organization_id:
                        type: string
                        format: uuid
                  invitation:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - role
                      - expires_at
                      - delivery
                    properties:
                      id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum:
                          - school_admin
                          - teacher
                          - staff
                          - driver
                      expires_at:
                        type: string
                        format: date-time
                      delivery:
                        type: string
                        enum:
                          - sent
                          - not_configured
                      token:
                        type: string
                        description: Returned ONCE, only when delivery is not_configured; never logged
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/invitations:
    post:
      tags:
        - accounts
      summary: Invite a staff member
      description: Issues a single-use, expiring (72 h), revocable invitation. A school administrator invites
        teacher/staff/driver for their own school; inviting a school_admin is a super-administrator act. Requires
        `identity.accounts.manage`.
      operationId: accountsCreateInvitation
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
                role:
                  type: string
                  enum:
                    - school_admin
                    - teacher
                    - staff
                    - driver
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - invitation
                properties:
                  invitation:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - role
                      - expires_at
                      - delivery
                    properties:
                      id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum:
                          - school_admin
                          - teacher
                          - staff
                          - driver
                      expires_at:
                        type: string
                        format: date-time
                      delivery:
                        type: string
                        enum:
                          - sent
                          - not_configured
                      token:
                        type: string
                        description: Returned ONCE, only when delivery is not_configured; never logged
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/invitations/{invitationId}/revoke:
    post:
      tags:
        - accounts
      summary: Revoke an open invitation
      description: Makes an unused invitation permanently unusable. Requires `identity.accounts.manage`.
      operationId: accountsRevokeInvitation
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/guardians/{guardianId}/invitations:
    post:
      tags:
        - accounts
      summary: Invite a guardian to link an account
      description: Invitation-based linking only. Issues a single-use, expiring (72 h), revocable invitation bound to this
        school, this guardian record and one live learner relationship; supersedes any open invitation for the guardian.
        Refused (409) when the guardian already has a live login. Requires `identity.accounts.manage`.
      operationId: guardianCreateInvitation
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: guardianId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - learner_id
                - method
              properties:
                learner_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                method:
                  type: string
                  enum:
                    - email
                    - sms
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - invitation
                properties:
                  invitation:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - method
                      - expires_at
                      - delivery
                    properties:
                      id:
                        type: string
                        format: uuid
                      method:
                        type: string
                        enum:
                          - email
                          - sms
                      expires_at:
                        type: string
                        format: date-time
                      delivery:
                        type: string
                        enum:
                          - sent
                          - not_configured
                          - failed
                      token:
                        type: string
                        description: Returned ONCE to the issuing administrator, only when delivery did not succeed; never logged
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/tenants/{tenantId}/guardian-invitations:
    get:
      tags:
        - accounts
      summary: List guardian invitations
      description: "Metadata only: contact masked, no token material. Requires `identity.accounts.manage`."
      operationId: guardianListInvitations
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - accepted
              - revoked
              - expired
              - superseded
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - invitations
                properties:
                  invitations:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - guardian_id
                        - learner_id
                        - contact_method
                        - contact_hint
                        - status
                        - delivery_status
                        - created_at
                        - expires_at
                        - accepted_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        guardian_id:
                          type: string
                          format: uuid
                        learner_id:
                          type: string
                          format: uuid
                        contact_method:
                          type: string
                          enum:
                            - email
                            - sms
                        contact_hint:
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - accepted
                            - revoked
                            - expired
                            - superseded
                        delivery_status:
                          type: string
                          enum:
                            - not_configured
                            - pending
                            - sent
                            - failed
                        created_at:
                          type: string
                          format: date-time
                        expires_at:
                          type: string
                          format: date-time
                        accepted_at:
                          type:
                            - string
                            - "null"
                          format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tenants/{tenantId}/guardian-invitations/{invitationId}/revoke:
    post:
      tags:
        - accounts
      summary: Revoke an open guardian invitation
      description: Makes an unused invitation permanently unusable. Requires `identity.accounts.manage`.
      operationId: guardianRevokeInvitation
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tenants/{tenantId}/guardians/{guardianId}/account-link/revoke:
    post:
      tags:
        - accounts
      summary: Revoke a guardian's account link
      description: Final and audited with a reason; the first half of relinking (then invite again). Requires
        `identity.accounts.manage`.
      operationId: guardianRevokeAccountLink
      security:
        - bearerAuth: []
      x-figbloom-authz: permission
      x-figbloom-permissions:
        - identity.accounts.manage
      x-figbloom-tenantScope: path.tenantId
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: guardianId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/guardian-invitations/preview:
    post:
      tags:
        - accounts
      summary: Preview a guardian invitation
      description: Public, rate limited. Reveals only the school name and relationship to the holder of a live token; every
        failure answers {valid:false}.
      operationId: guardianPreviewInvitation
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  school_name:
                    type: string
                  relationship:
                    type: string
                  contact_method:
                    type: string
                    enum:
                      - email
                      - sms
                  existing_account:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/guardian-invitations/accept:
    post:
      tags:
        - accounts
      summary: Accept a guardian invitation
      description: Public, rate limited. Requires the token, the invited contact (echo) and explicit confirm=true. A new
        e-mail-invited person sets a password (Argon2id); an existing account (and every phone invitation) must send its
        own bearer token, otherwise 401. A guardian record is linked to at most one live login. Every failure cause
        answers identically.
      operationId: guardianAcceptInvitation
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - contact
                - confirm
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                contact:
                  type: string
                  minLength: 3
                  maxLength: 254
                confirm:
                  type: boolean
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - tenant_id
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
                  tenant_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me/guardian-links:
    get:
      tags:
        - accounts
      summary: The signed-in person's live guardian links
      description: Own links only (tenant, guardian record, learner). Links of a deactivated membership or disabled account
        are not returned.
      operationId: guardianMyLinks
      security:
        - bearerAuth: []
      x-figbloom-authz: authenticated
      x-figbloom-tenantScope: none
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - tenant_id
                        - guardian_id
                        - learner_id
                      properties:
                        tenant_id:
                          type: string
                          format: uuid
                        guardian_id:
                          type: string
                          format: uuid
                        learner_id:
                          type: string
                          format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/invitations/accept:
    post:
      tags:
        - accounts
      summary: Accept an invitation
      description: Public, rate limited. A new person sets a password (Argon2id). A person who already has an account must
        call this with their own bearer token; otherwise 401. Every failure cause (unknown, used, revoked, expired)
        answers identically.
      operationId: accountsAcceptInvitation
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - tenant_id
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
                  tenant_id:
                    type:
                      - string
                      - "null"
                    format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password-reset/request:
    post:
      tags:
        - auth
      summary: Request a password reset
      description: "Public, rate limited, enumeration-safe: always 202 with the same body whether or not the account exists.
        The token is delivered through the account notifier (no provider is configured by default, so a self-service
        reset cannot complete until one is)."
      operationId: authRequestPasswordReset
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/password-reset/complete:
    post:
      tags:
        - auth
      summary: Complete a password reset
      description: Public, rate limited. Single-use, expiring token. Replaces the password and REVOKES EVERY SESSION of the user.
      operationId: authCompletePasswordReset
      x-figbloom-authz: public
      x-figbloom-tenantScope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 20
