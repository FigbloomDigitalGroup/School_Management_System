components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional (FIG-1623). 8-128 characters from `A-Z a-z 0-9 . _ : -`. Within 24 hours, for the same school,
        caller and key: the same request again returns the ORIGINAL status with the resource re-read by reference (so it
        reflects the resource's current state; header `Idempotent-Replayed: true`) and causes no second effect or audit
        event; a different request with the same key is `422 idempotency_key_reused`. Concurrent duplicates produce one
        effect. A caller who is not (or no longer) authorised is refused as usual: a key never grants access. Guarantee:
        at most one committed effect per (school, caller, key) in the window; not exactly-once across client, network or
        process failures. Header-less requests are unchanged."
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: "Optional request-scoped school. Never an authority: it is honoured only when the caller holds a school
        membership, active organisation-admin reach or platform super-admin, re-checked on every request. Must be a UUID
        (400 otherwise). Absent: the session's active school applies."
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: >
        Page size (FIG-1621). Default 50, maximum 200. Decimal integers only; values above 200, `0x10`, `1e2` and
        non-integers are `400 validation_error`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque SQL keyset cursor v2 from a previous `page.next_cursor`. Keys are PostgreSQL text (timestamps preserve
        microseconds). Bound to sort, filter and tenant/org scope fingerprint. Wrong version, wrong key types, reuse
        across tenants/filters/sorts, truncation or tampering → `400 validation_error`. Cursors carry no privilege.
      schema:
        type: string
        minLength: 8
        maxLength: 2048
    SearchQuery:
      name: q
      in: query
      required: false
      description: >
        Case-insensitive "contains" search over the listed name fields (learners also match the admission number). The
        value is matched LITERALLY: `%`, `_` and `\` are escaped, so `q=%` is a search for a per-cent sign and not a way
        to return every row (P3-AUDIT-013). Bounded at 120 characters — the longest searchable value — and control
        characters are refused (400). Blank or whitespace-only behaves as if `q` were absent. Personal names are never
        normalised: accents, apostrophes and non-Latin scripts are compared as typed.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    PageSortUnsupported:
      name: sort
      in: query
      required: false
      description: >
        Not supported on this endpoint. Only the documented fixed sort is used. Any other value is `400
        validation_error` (never silently ignored).
      schema:
        type: string
  responses:
    ValidationError:
      description: Malformed or oversized request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Authenticated but not authorized (default deny). Also returned, for every authenticated route except POST
        /v1/auth/password/change, POST /v1/auth/logout and GET /v1/auth/me, while the user's `must_change_password` flag
        is set ("Password change required", FIG-1604). Sensitive operations (administrator password resets, membership
        deactivation, school provisioning, school-administrator invitations, guardian-link revocation, finance
        reconciliation resolution, unacknowledged-prompt withdrawal, operator M-Pesa reconciliation, unmatched-callback
        resolution/reopen, organization-delegation grant/revoke, guardian-access grant/revoke, staff-area changes and a
        change of the school name or timezone) answer 403 with code `reauth_required` when the session was not created
        or password-confirmed within the last 5 minutes: call POST /v1/auth/reauth and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource or membership does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict (for example duplicate admission number)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds route or global bodyLimit (64 KiB global, 1.5 MiB for learner CSV import preview)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Auth token bucket exhausted (capacity 5, +2 tokens per 5 s, cost 1 per attempt, per IP first then per
        account). Retry-After is omitted when the request cost exceeds capacity (waiting cannot help for that cost).
      headers:
        Retry-After:
          description: Whole seconds until the request would be admitted (omitted when cost > capacity)
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
