import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services" // Push notifications (FIG-293)

// Release signing (FIG-777). key.properties is gitignored and only exists on
// machines that have the real upload keystore — see key.properties.example.
// Deliberately NOT falling back to the debug signingConfig when it's absent:
// release builds without it simply aren't signable, which is correct.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google Maps SDK for Android key (FIG-874) — a separate, Android-restricted
// key from VITE_GOOGLE_MAPS_API_KEY (that one's a browser key for the web
// Maps JS API; this one needs "Maps SDK for Android" enabled instead).
// local.properties is already gitignored (it's where the Android SDK path
// normally lives) and never exists in CI, so this defaults to empty rather
// than failing the build — the map just won't render tiles until it's set.
def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   npm workspaces monorepo: node_modules is hoisted to the repo root
    //   (2 levels above apps/mobile), not apps/mobile/node_modules, so the
    //   defaults below are wrong here and need the explicit overrides.
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    //   Same hoisting problem breaks the Gradle plugin's own hermesc
    //   auto-detection (it fails to substitute %OS-BIN% and errors with
    //   "Couldn't determine Hermesc location") — point it at the real
    //   per-OS binary under the hoisted react-native package directly.
    hermesCommand = Os.isFamily(Os.FAMILY_WINDOWS)
        ? file("../../../../node_modules/react-native/sdks/hermesc/win64-bin/hermesc.exe").absolutePath
        : Os.isFamily(Os.FAMILY_MAC)
            ? file("../../../../node_modules/react-native/sdks/hermesc/osx-bin/hermesc").absolutePath
            : file("../../../../node_modules/react-native/sdks/hermesc/linux64-bin/hermesc").absolutePath

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.figbloom.schools"
    defaultConfig {
        applicationId "com.figbloom.schools"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY", "")]
    }
    // A small APK for sending to phones directly. The release workflow passes
    // -PsmallApk to its APK step only; the Play bundle and everyday builds are
    // unchanged. It stores the native libraries compressed (about 29 MB of them
    // become about 11 MB), for more room on the phone once installed. It expects
    // the native build to be limited to the two phone architectures, arm64-v8a
    // and armeabi-v7a, with -PreactNativeArchitectures=armeabi-v7a,arm64-v8a.
    // That is still one APK that installs on every phone; only x86 and x86_64
    // (emulators, Chromebooks) are left out, so use a debug build there.
    if (project.hasProperty("smallApk")) {
        packaging {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Push notifications (FIG-293) — @react-native-firebase/messaging autolinks
    // against these; the BoM keeps their versions in step with google-services.json.
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-messaging"
}
