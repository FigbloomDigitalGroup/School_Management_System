buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        // Android 8.0 — the floor the product targets (see apps/mobile/README.md).
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.25"
        // react-native-maps needs play-services-location 21.3.0; react-native-geolocation-service
        // defaults to 18.0.0. The app can only ship one copy (the newer), so the GPS library has to
        // be compiled against it too: FusedLocationProviderClient is a class in 18 and an interface
        // in 21, and a mismatch crashes the first location request (IncompatibleClassChangeError).
        playServicesLocationVersion = "21.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Push notifications (FIG-293) — reads android/app/google-services.json.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-background-actions (FIG-162) calls ServiceCompat.startForeground()'s
// 4-arg overload, added in androidx.core 1.12.0. Whatever transitive default
// resolves across these subprojects (firebase-bom pins its own androidx
// versions) is older and missing that symbol — force it repo-wide, since a
// per-module dependency addition doesn't affect other subprojects' classpaths.
allprojects {
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
        }
    }
}
