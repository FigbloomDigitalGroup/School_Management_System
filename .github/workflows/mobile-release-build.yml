name: Mobile release build (Android)

# FIG-781: there was no build/release pipeline of any kind for apps/mobile
# before this — every release build was a manual
# ./gradlew/Xcode run on someone's laptop. This gives Android a repeatable,
# auditable CI build that produces a signed, upload-ready AAB.
#
# iOS is intentionally not here yet: it's blocked on FIG-463 (Apple Developer
# Program enrollment) and has no signing identity to build with (see
# FIG-777/FIG-779). Add an iOS job once that exists instead of shipping a job
# that would just fail on every run.
#
# Manual trigger only — this does not build/sign anything until the secrets
# below are added in the repo's Settings > Secrets and variables > Actions.
# Nothing here uploads to Play Console; it hands you a signed AAB/APK as a
# workflow artifact to upload yourself (or to wire into a future fastlane
# supply / upload-google-play step once a Play Console service account
# exists).

# One app serves every role (parent, student, driver, teacher), so there is
# nothing to choose between.
on:
  workflow_dispatch:

# The job reads the repo and uploads an artifact; it needs no other access to GitHub.
permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      APP_DIR: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Before anything is installed, and long before the signing secrets are
      # written below. Actions are pinned to a commit, not a tag, because a tag
      # can be moved to different code after it has been reviewed.
      - name: Security scan
        run: sh scripts/security-scan.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # --ignore-scripts (FIG-1215): the signing keystore and passwords are
      # written to disk in the very next steps, so no dependency may run code at
      # install time before they exist. Only esbuild, fsevents and protobufjs
      # have install scripts, and none of them is needed to build the app.
      # ci.yml installs the same way.
      - name: Install dependencies (npm workspaces)
        run: npm ci --ignore-scripts

      # The app needs its release keystore (binary, base64-encoded),
      # its android/key.properties (the passwords/alias build.gradle reads —
      # see FIG-777 and apps/mobile/android/key.properties.example), and its
      # .env (the Supabase URL/anon key — see FIG-782 and apps/mobile/.env.example).
      # None of these exist in this repo; add them
      # in GitHub's Settings > Secrets and variables > Actions before running
      # this workflow. Never commit the real values anywhere.
      - name: Write Android signing config
        # Secrets are passed in via `env:` and read as "$VAR" below, never
        # interpolated directly into the script with ${{ secrets.* }} — a
        # secret value containing a quote/backtick/$() would otherwise break
        # out of the generated script and run as arbitrary shell (GitHub's
        # own Actions hardening guidance calls this out explicitly).
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          MOBILE_KEY_PROPERTIES: ${{ secrets.MOBILE_KEY_PROPERTIES }}
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}
        run: |
          echo "$MOBILE_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/app/figbloom-mobile-release.keystore"
          echo "$MOBILE_KEY_PROPERTIES" > "$APP_DIR/android/key.properties"
          echo "$MOBILE_ENV_FILE" > "$APP_DIR/.env"

      # The Bus map needs its own "Maps SDK for
      # Android" key (MAPS.md). Without one the build still succeeds and ships a
      # map with no tiles, so fail here rather than release that. Add
      # MAPS_API_KEY in Settings > Secrets and variables > Actions.
      - name: Write Google Maps key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::The MAPS_API_KEY secret is not set, so the Bus map would have no tiles."
            exit 1
          fi
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" >> "$APP_DIR/android/local.properties"

      # Two Gradle runs, because the two outputs want different things. The AAB
      # is what goes to Play: all four architectures, and Play hands each phone
      # only its own, so it needs no trimming.
      - name: Build release AAB (Play)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      # The APK is for sending to phones directly: one file that installs on
      # every phone, old or new (about 26 MB). It carries both phone
      # architectures, arm64-v8a and armeabi-v7a, with the native libraries
      # stored compressed; the default APK carries x86 and x86_64 as well and is
      # about 120 MB. x86 and x86_64 (emulators, Chromebooks) are left out, so use
      # a debug build on the emulator. -PsmallApk is read in app/build.gradle. The
      # native code for these two architectures was built by the step above, so
      # this run is much shorter.
      - name: Build release APK (one file, all phones, small)
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease -PsmallApk -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-release-${{ github.run_number }}
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/*.aab
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
