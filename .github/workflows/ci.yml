name: CI

# Runs on every pull request, and on main. Nothing is installed or executed
# until the security scan has passed: the September 2026 attacks ran code from
# a build config file the moment anyone built the project (see
# .agents/SECURITY.md), so the scan reads files and never runs any of them.
#
# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# point at different code after we've reviewed it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sh scripts/security-scan.sh

  pre-pr-check:
    # CHANGELOG.md rules for anything going into dev-staging or main: the branch
    # contains main, no migration or edge function already on main is edited or
    # deleted, new migrations are dated after main's newest, and there's a
    # CHANGELOG entry. Reads git history only.
    name: Pre-PR check (CHANGELOG rules)
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev-staging')
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sh scripts/pre-pr-check.sh "$PR_HEAD"
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

  checks:
    name: Typecheck, lint, unit tests
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: no dependency gets to run code at install time.
      - run: npm ci --ignore-scripts
      # The client's types come from apps/api/openapi/openapi.yaml: a change to the contract must come with the regenerated file.
      - run: npm run api:types:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  # FIG-1606: the @figbloom/api workspace. The root `checks` job does not cover it (the root
  # typecheck script omits it and the root unit tests are web/shared only), so without this job
  # no API change, migration or RLS regression is gated. Every step fails the job on a genuine
  # error: no continue-on-error, no excluded test, no allowlisted advisory.
  #
  # The test files run one at a time against one database (fileParallelism: false), about 7 minutes
  # in a row, so they are split by file across three machines, each with its own throwaway
  # database. The one-off checks (audit, typecheck, lint, migrations, OpenAPI) run in part 1 only.
  # Together the three parts run every test file exactly once.
  api:
    name: API ${{ matrix.part }}/3 (${{ matrix.part == 1 && 'typecheck, lint, migrations, OpenAPI, audit, tests' || 'tests' }})
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing part must not cancel the others: each reports its own failures.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    # Read-only token; the job writes nothing and publishes nothing.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    services:
      postgres:
        # A throwaway container: its credentials belong to it alone and reach nothing real.
        # Mapped to non-development port 59822 so the four-condition testTarget safety guard
        # (non-forbidden port + explicit FIGBLOOM_TEST_DB_DESIGNATION + database marker) holds.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: figbloom_api
        ports: ["59822:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d figbloom_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite resets this database, so it requires loopback + figbloom_api on a non-dev port,
      # an explicit FIGBLOOM_TEST_DB_DESIGNATION, and the disposable database comment marker.
      # The tests give figbloom_app a random per-run password, so the application under test
      # connects as that non-owner role, never as this owner.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:59822/figbloom_api
      FIGBLOOM_TEST_DB_DESIGNATION: 127.0.0.1:59822/figbloom_api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Reproducible install from the committed lockfile (fails if it and the manifests disagree);
      # --ignore-scripts so no dependency runs code at install time.
      - run: npm ci --ignore-scripts
      # Audit gate for the API workspace, production and development dependencies: any finding fails.
      - if: matrix.part == 1
        run: npm audit --workspace @figbloom/api
      - if: matrix.part == 1
        run: npm run typecheck --workspace @figbloom/api
      # The root flat config, scoped to the API source and tests. apps/api/scripts/*.mjs is left
      # out on purpose: the root config gives those two committed scripts no Node globals, so
      # linting them fails today ('process' is not defined). That is a separate config fix.
      - if: matrix.part == 1
        run: npx eslint apps/api/src apps/api/test
      # Every part builds and migrates: the tests include a compiled-build smoke test, and each
      # part starts from the same migrated database the single job used to.
      - run: npm run build --workspace @figbloom/api
      # Compiled migrations as the migrator: apply, verify, and a second run must be a no-op.
      - run: npm run migrate --workspace @figbloom/api
      - if: matrix.part == 1
        run: npm run migrate:verify --workspace @figbloom/api
      - if: matrix.part == 1
        run: npm run migrate --workspace @figbloom/api
      - if: matrix.part == 1
        run: npm run openapi:check --workspace @figbloom/api
      # Stamp the throwaway CI container with the disposable test-database marker before vitest globalSetup.
      - run: node apps/api/scripts/designate-test-db.mjs
      # The API suite, a third of the files per part: RLS and tenant isolation through the real
      # figbloom_app login, runtime-role assertions, SECURITY DEFINER inventory, credential access,
      # idempotency, headers/CORS, logging redaction, delegation, forced password change, the
      # architecture rules and a compiled-build smoke test.
      - run: npm run test --workspace @figbloom/api -- --shard=${{ matrix.part }}/3

  edge-functions:
    name: Edge function tests (Deno)
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Same command as `npm run test:edge`. The tests run against a fake
      # Supabase client (supabase/functions/_shared/fakeSupabase.ts), so no
      # database or secrets are needed.
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions

  database-and-browser:
    # Three machines, each with its own throwaway Supabase stack, instead of one machine running the
    # SQL checks and then the browser tests (13 to 24 minutes in a row). Separate stacks also mean
    # tenant_matrix.sql no longer stalls the other scripts or the browser tests.
    name: ${{ matrix.name }} (local Supabase)
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Browser tests
            part: browser
          # The slowest script by far, so it has a machine to itself.
          - name: RLS checks, tenant matrix
            part: rls
            scripts: supabase/rls-checks/tenant_matrix.sql
          # Every other script, worked out at run time so that a new script is never left out.
          - name: RLS checks, all other scripts
            part: rls
            scripts: $(ls supabase/rls-checks/*.sql | grep -vxF supabase/rls-checks/tenant_matrix.sql)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Supabase's own action, pinned to the commit its v3.0.1 tag points at. The CLI version is
      # the one the team develops with.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      # Postgres, Auth, Storage and the edge runtime in Docker, with supabase/migrations applied.
      # Containers a part never uses are left out, so their images are not downloaded: Studio and
      # its postgres-meta everywhere; for the SQL checks also realtime, the edge runtime, image
      # resizing and the mail catcher (the scripts talk to Postgres only, and the seeds to Auth,
      # REST and Storage).
      - run: supabase start -x ${{ matrix.part == 'rls' && 'studio,postgres-meta,realtime,edge-runtime,imgproxy,mailpit' || 'studio,postgres-meta' }}
      # The keys below belong to this throwaway stack, not to any real project.
      - name: Write .env from the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env
      - run: npm run db:seed
      - run: npm run db:seed-org
      - if: matrix.part == 'rls'
        run: sh scripts/run-rls-checks.sh ${{ matrix.scripts }}
      - if: matrix.part == 'browser'
        run: npx playwright install --with-deps chromium
      # The five critical flows. The longer specs (accessibility walk, usability, reports) take
      # about an hour together and run by hand: npx playwright test
      - if: matrix.part == 'browser'
        run: npx playwright test e2e/flows.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.part == 'browser'
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # FIG-1890 (W1): Playwright smoke tests for the web app built with VITE_BACKEND=api against a local apps/api.
  browser-api:
    name: Browser tests (local API)
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: figbloom_api
        ports: ["59822:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d figbloom_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:59822/figbloom_api
      FIGBLOOM_TEST_DB_DESIGNATION: 127.0.0.1:59822/figbloom_api
      API_URL: http://127.0.0.1:4199
      VITE_BACKEND: api
      VITE_API_URL: http://127.0.0.1:4199
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @figbloom/api
      - run: npm run migrate --workspace @figbloom/api
      - run: node apps/api/scripts/designate-test-db.mjs
      - run: npx playwright install --with-deps chromium
      - name: Bootstrap API, seed demo school, and run Playwright API specs
        run: |
          set -euo pipefail
          APP_PW=$(openssl rand -base64 24 | tr '+/' '-_' | tr -d '=')
          HMAC_KEY=$(openssl rand -base64 36 | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$APP_PW"
          echo "::add-mask::$HMAC_KEY"

          APP_PW="$APP_PW" node --input-type=module -e '
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.MIGRATION_DATABASE_URL });
            await client.connect();
            const pw = process.env.APP_PW.replace(/'\''/g, "'\'''\''");
            await client.query(`ALTER ROLE figbloom_app WITH LOGIN PASSWORD '\''${pw}'\''`);
            await client.end();
          '

          SESSION_MINT_HMAC_KEY="$HMAC_KEY" node apps/api/scripts/session-hmac.mjs provision --key-id ci-browser-api --from-env

          BOOTSTRAP_OUT=$(
            BOOTSTRAP_ADMIN_EMAIL=bootstrap@figbloom.test \
            BOOTSTRAP_ADMIN_NAME="CI Super Admin" \
            FIGBLOOM_BOOTSTRAP_CONFIRM=yes \
            node apps/api/scripts/bootstrap-admin.mjs
          )
          SETUP_TOKEN=$(printf '%s\n' "$BOOTSTRAP_OUT" | tail -n 1 | tr -d '\r')
          echo "::add-mask::$SETUP_TOKEN"

          DATABASE_URL="postgresql://figbloom_app:${APP_PW}@127.0.0.1:59822/figbloom_api" \
          SESSION_MINT_HMAC_KEY="$HMAC_KEY" \
          API_HOST=127.0.0.1 \
          API_PORT=4199 \
          CORS_ALLOWED_ORIGINS="http://localhost:5173,http://127.0.0.1:5173" \
          AUTH_RATE_CAPACITY=1000 \
          AUTH_RATE_REFILL=1000 \
          MFA_ENFORCEMENT=enforce \
          node apps/api/dist/index.js > /tmp/figbloom-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4199/readyz > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4199/readyz > /dev/null || { cat /tmp/figbloom-api.log; exit 1; }

          BOOTSTRAP_ADMIN_EMAIL=bootstrap@figbloom.test BOOTSTRAP_SETUP_TOKEN="$SETUP_TOKEN" npm run api:seed
          npx playwright test e2e/api/ --project=desktop
          # Verify re-running the demo seed is idempotent.
          BOOTSTRAP_ADMIN_EMAIL=bootstrap@figbloom.test npm run api:seed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results-api
          path: test-results
          retention-days: 7
