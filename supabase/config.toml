project_id = "figbloom"

# Ports moved off the 54278-54377 / 54411-54510 ranges, which Windows reserves
# for Hyper-V/WSL NAT on this machine (`netsh interface ipv4 show excludedportrange
# protocol=tcp`) and refuses to let Docker bind to.
[api]
enabled = true
port = 58321
schemas = ["public"]

[db]
port = 58322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 58323

[local_smtp]
enabled = true
port = 58324

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "figbloom://"]
jwt_expiry = 3600
# The public /auth/v1/signup endpoint is off (accounts are created by invite,
# via auth.admin.createUser in supabase/seed.ts) — but auth.email's own
# "enable_signup" is actually the toggle for the whole email provider in this
# CLI's config->env mapping (GOTRUE_EXTERNAL_EMAIL_ENABLED), so that one stays
# true or *no one* can sign in, invited or not. Every account signs in via
# email now, real or the synthetic login_id-derived kind (FIG-396) — phone/SMS
# auth was only ever used for the parent OTP flow that scheme replaced, so
# there is no [auth.sms] section here any more.
enable_signup = false
# The "choose your password" forms ask for 8 characters; Auth enforces it too
# (FIG-1338). Hosted: Authentication > Providers > Email > Minimum password length.
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.invite-admin]
verify_jwt = true

[functions.bus-tick]
verify_jwt = true              # the driver's own session (or the service role, for simulate-trip.ts)

[functions.rider-update]
verify_jwt = true              # the driver's own session: pushes "got on / got off" and breakdowns to families

[functions.mpesa-stk-push]
verify_jwt = true

[functions.mpesa-callback]
verify_jwt = false             # Safaricom cannot send a JWT

[functions.signup-organization]
verify_jwt = false             # public self-service signup — the caller has no account yet, so no JWT to verify

[functions.search-schools]
verify_jwt = false             # pre-auth "choose your school" step of sign-in — no JWT yet

[functions.resolve-login-id]
verify_jwt = false             # pre-auth login_id -> email lookup, the other half of sign-in — no JWT yet

[functions.request-password-reset]
verify_jwt = false             # "Forgot password?" from the sign-in screen — the person can't sign in, so no JWT

[functions.reset-user-password]
verify_jwt = true              # the school admin / org admin / parent setting the new temporary password

[functions.visit-notify]
verify_jwt = true              # the gate, reception or office that just recorded or escalated a visit; secret FCM_SERVICE_ACCOUNT_JSON_B64

[functions.medical-notify]
verify_jwt = true              # the nurse who just set a sick bay visit's outcome; secret FCM_SERVICE_ACCOUNT_JSON_B64

[functions.ai-assist]
verify_jwt = true              # staff drafting, or a learner asking Bloom; secrets AI_PROVIDER (openai|anthropic), OPENAI_API_KEY or ANTHROPIC_API_KEY, optional AI_MODEL

[functions.call-token]
verify_jwt = true              # in-app calls and live classes; secrets LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
